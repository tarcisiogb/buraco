name: Publicar regras do Firestore

on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firebase.json
      - .github/workflows/deploy-rules.yml
  workflow_dispatch:

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Autenticar no Google
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          test -n "$SA_JSON" || { echo "Secret FIREBASE_SERVICE_ACCOUNT nao configurado"; exit 1; }
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          python3 - <<'PY'
          import json, os, sys, base64
          f = os.path.join(os.environ["RUNNER_TEMP"], "sa.json")
          raw = open(f, encoding="utf-8", errors="replace").read()
          print("::notice title=Diagnostico do secret::caracteres=%d linhas=%d primeiro_char=%r ultimo_char=%r" % (len(raw), raw.count("\n") + 1, raw.strip()[:1], raw.strip()[-1:]))
          cands = [raw.strip()]
          t = raw.strip().strip("\u201c\u201d\"'").strip()
          cands.append(t)
          cands.append("{" + raw.strip())
          cands.append("{" + raw.strip() + "}")
          try: cands.append(base64.b64decode(raw.strip()).decode("utf-8"))
          except Exception: pass
          d = None
          for c in cands:
              try:
                  d = json.loads(c)
                  if isinstance(d, str): d = json.loads(d)
                  if isinstance(d, dict):
                      open(f, "w", encoding="utf-8").write(json.dumps(d)); break
              except Exception:
                  d = None
          if not isinstance(d, dict):
              print("::error title=Secret invalido::nao e um JSON valido. Veja o diagnostico acima (caracteres/linhas/primeiro e ultimo caractere).")
              sys.exit(1)
          print("::notice title=Chave lida::type=%s email=%s project=%s tem_private_key=%s" % (d.get("type"), d.get("client_email"), d.get("project_id"), bool(d.get("private_key"))))
          PY
      - name: Publicar firestore.rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          set +e
          npx -y firebase-tools@13 deploy --only firestore:rules --project buraco-c454c --non-interactive > "$RUNNER_TEMP/deploy.log" 2>&1
          code=$?
          cat "$RUNNER_TEMP/deploy.log"
          if [ $code -ne 0 ]; then
            echo "::error title=Falha ao publicar regras::$(grep -v -e '^$' -e 'npm warn' "$RUNNER_TEMP/deploy.log" | tail -n 12 | tr '\n' ' ' | cut -c1-900)"
          fi
          exit $code
