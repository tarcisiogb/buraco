name: Tornar Master (uso unico)

on:
  workflow_dispatch:
    inputs:
      email:
        description: "E-mail do cadastro que vira Master"
        required: true

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Promover a Master
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TARGET_EMAIL: ${{ github.event.inputs.email }}
        run: |
          mkdir work && cd work && npm init -y >/dev/null && npm i firebase-admin@12 >/dev/null 2>&1
          cat > run.js <<'JS'
          const admin = require('firebase-admin');
          let raw = (process.env.SA_JSON || '').trim(), sa = null;
          for (const c of [raw, '{' + raw, '{' + raw + '}']) { try { sa = JSON.parse(c); if (sa && sa.private_key) break; } catch (e) {} }
          if (!sa) { console.error('Secret invalido'); process.exit(1); }
          admin.initializeApp({ credential: admin.credential.cert(sa) });
          const email = (process.env.TARGET_EMAIL || '').trim();
          (async () => {
            const db = admin.firestore();
            const snap = await db.collection('jogadores').where('email', '==', email).get();
            if (snap.empty) { console.error('Nenhum cadastro com o e-mail ' + email + '. Crie o cadastro no app primeiro (e confira o e-mail).'); process.exit(1); }
            for (const d of snap.docs) { await d.ref.update({ role: 'master', status: 'aprovado' }); console.log('OK: ' + d.id + ' agora e master/aprovado'); }
          })().catch(e => { console.error('ERRO: ' + e.message); process.exit(1); });
          JS
          node run.js
