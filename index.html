<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buraco da Família</title>
<meta name="description" content="Buraco online para jogar em família.">
<meta name="theme-color" content="#0f3d2e">
<meta property="og:title" content="Buraco da Família">
<meta property="og:description" content="Buraco online para jogar em dupla com a família.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://tarcisiogb.github.io/buraco/">
<meta property="og:image" content="https://tarcisiogb.github.io/buraco/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Buraco da Família">
<meta name="twitter:description" content="Buraco online para jogar em dupla com a família.">
<meta name="twitter:image" content="https://tarcisiogb.github.io/buraco/og-image.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --felt:#0f3d2e; --felt-deep:#0b2e22; --felt-soft:#e8f1ec; --paper:#f5f3ec; --ink:#14231c;
  --ink-soft:#5d6b63; --line:#e1e5de; --gold:#c9a13b; --gold-soft:#fbf3dc; --red:#b23a2e; --red-soft:#fbe9e7;
  --ok:#1f7a44; --shadow:0 10px 30px rgba(10,40,28,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:'Inter',system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit;font-size:16px}
:focus-visible{outline:2.5px solid var(--gold);outline-offset:2px;border-radius:8px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
img{max-width:100%}
.wrap{max-width:920px;margin:0 auto;padding:0 16px 80px}
.wrap.auth{max-width:440px;padding-top:28px}
.brand{text-align:center;margin:8px 0 22px}
.brand .logo{width:72px;height:72px;border-radius:20px;background:var(--felt);color:#f4efe0;display:inline-grid;place-items:center;font-size:44px;box-shadow:var(--shadow);border:2px solid var(--gold)}
.brand h1{font-family:'Archivo',sans-serif;font-weight:900;font-size:28px;margin-top:12px;letter-spacing:-.5px}
.brand p{color:var(--ink-soft);margin-top:4px;font-size:15px}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:14px;box-shadow:var(--shadow)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.ph{font-family:'Archivo',sans-serif;font-weight:800;font-size:21px;margin-top:2px}
.muted{color:var(--ink-soft);font-size:14px;line-height:1.45}
label.f{display:block;margin-top:14px;font-size:13px;font-weight:600;color:var(--ink-soft)}
.in{width:100%;margin-top:6px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.in:focus{border-color:var(--felt);outline:none}
.in[readonly]{background:#f3f4f1;color:var(--ink-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border:0;border-radius:12px;background:var(--felt);color:#fff;font-weight:700;cursor:pointer;width:100%;margin-top:16px}
.btn:hover{background:var(--felt-deep)}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{background:var(--felt-soft)}
.btn.gold{background:var(--gold);color:#241a02}
.btn.danger{background:var(--red)}
.btn.small,.btn.mini{width:auto;min-height:36px;padding:0 12px;font-size:14px;margin-top:0}
.btn.mini{min-height:32px;padding:0 10px;font-size:13px}
.btn.ok{background:var(--ok)}
.link{background:none;border:0;color:var(--felt);font-weight:600;cursor:pointer;text-decoration:underline;font-size:14px}
.tabs{display:flex;gap:6px;margin:16px 0 0;overflow-x:auto}
.tab{flex:1;min-width:max-content;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:700;color:var(--ink-soft);cursor:pointer;position:relative}
.tab.on{background:var(--felt);color:#fff;border-color:var(--felt)}
@media(hover:hover){.tab:not(.on):hover{background:var(--felt-soft)}}
.dot{position:absolute;top:6px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--red)}
.msg{padding:11px 14px;border-radius:12px;margin-top:14px;font-size:14px;line-height:1.4}
.msg.err{background:var(--red-soft);color:#7a1f16}
.msg.ok{background:var(--felt-soft);color:#0d4a2c}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 0 4px;gap:10px}
.topbar .who{display:flex;align-items:center;gap:10px;min-width:0}
.topbar .name{font-weight:700;line-height:1.1}
.topbar .sub{font-size:12px;color:var(--ink-soft)}
.av{width:44px;height:44px;border-radius:50%;background:var(--felt);color:#f4efe0;display:grid;place-items:center;font-weight:800;overflow:hidden;flex:none;border:2px solid var(--gold);cursor:pointer}
.av img{width:100%;height:100%;object-fit:cover}
.av.sm{width:38px;height:38px;font-size:14px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child,.ph + .row{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:13px;color:var(--ink-soft)}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--felt-soft);color:var(--felt)}
.badge.m{background:var(--gold-soft);color:#7a5a06}
.badge.p{background:var(--red-soft);color:var(--red)}
.photoedit{display:flex;align-items:center;gap:14px;margin-top:14px}
.photobig{width:84px;height:84px;border-radius:50%;background:var(--felt);color:#f4efe0;display:grid;place-items:center;font-size:28px;font-weight:800;overflow:hidden;border:3px solid var(--gold)}
.photobig img{width:100%;height:100%;object-fit:cover}
.modalbg{position:fixed;inset:0;background:rgba(5,25,17,.65);display:grid;place-items:center;padding:18px;z-index:50}
.modal{background:#fff;border-radius:20px;padding:22px;max-width:360px;width:100%;text-align:center}
.modal .big{width:200px;height:200px;border-radius:50%;margin:0 auto 14px;background:var(--felt);color:#f4efe0;display:grid;place-items:center;font-size:64px;font-weight:800;overflow:hidden;border:4px solid var(--gold)}
.modal .big img{width:100%;height:100%;object-fit:cover}
.modal h3{font-family:'Archivo',sans-serif;font-weight:800;font-size:22px}
.soon{display:grid;place-items:center;text-align:center;padding:26px 10px;border:2px dashed var(--line);border-radius:16px;margin-top:12px;color:var(--ink-soft)}
.soon .big{font-size:40px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--felt-soft);border-radius:14px;padding:12px 6px;text-align:center}
.stat b{display:block;font-family:'Archivo',sans-serif;font-size:22px}
.stat span{font-size:12px;color:var(--ink-soft)}
.build{text-align:center;font-size:11px;color:#9aa59e;margin-top:26px}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--ink-soft);text-align:center;gap:10px}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--felt);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.or{display:flex;align-items:center;gap:10px;margin:16px 0 0;color:var(--ink-soft);font-size:13px}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.gbtn{background:#fff;color:var(--ink);border:1.5px solid var(--line);margin-top:12px}
.gbtn:hover{background:#f6f6f3}
/* ───── Mesas e jogo ───── */
.seatgrid{display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:auto auto auto;gap:10px;margin-top:14px;align-items:center}
.seat{border:2px dashed var(--line);border-radius:16px;padding:10px 6px;text-align:center;min-height:104px;display:grid;place-items:center;background:#fff;cursor:pointer;font-weight:700;color:var(--ink-soft)}
.seat.taken{border-style:solid;cursor:default;color:var(--ink)}
.seat.mine{border-color:var(--gold);background:var(--gold-soft)}
.seat .nm{font-size:13px;margin-top:6px;line-height:1.1}
.seat.ta{box-shadow:inset 0 -4px 0 #2d6cdf}.seat.tb{box-shadow:inset 0 -4px 0 #c0572b}
.seat .tm{font-size:11px;font-weight:700;opacity:.7}
.mesaitem{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.mesaitem:first-of-type{border-top:0}
.avs{display:flex}.avs .av{width:30px;height:30px;font-size:11px;margin-left:-8px;cursor:default;border-width:2px}.avs .av:first-child{margin-left:0}
.avs .empty{background:#e9ece8;color:#9aa59e;border-color:#fff}
.wrap.game{max-width:560px;padding:0 10px 40px}
.gtop{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0}
.score{display:flex;gap:8px}.sc{background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px}.sc b{font-family:'Archivo',sans-serif;font-size:16px}.sc.me{background:var(--felt);color:#fff;border-color:var(--felt)}
.opps{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.chip{background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 4px;text-align:center;font-size:12px;position:relative}
.chip.turn{border-color:var(--gold);background:var(--gold-soft)}
.chip .av{margin:0 auto 4px;width:36px;height:36px;font-size:13px;cursor:default}
.chip .nm{font-weight:700;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .ct{color:var(--ink-soft)}
.chip .tag{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:10px;background:var(--felt);color:#fff;border-radius:999px;padding:1px 7px;white-space:nowrap}
.felt{background:radial-gradient(circle at 50% 30%,#1b6a4d,#0f3d2e);border-radius:18px;padding:12px;margin-top:10px;color:#f4efe0}
.center{display:flex;justify-content:center;gap:18px;align-items:flex-end;flex-wrap:wrap}
.pile{text-align:center;font-size:12px}
.pile .cap{margin-top:4px;opacity:.85}
.pc{width:46px;height:66px;border-radius:7px;background:#fbf8ef;border:1px solid #cfc8b2;color:#14231c;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:3px 0;font-family:'Archivo',sans-serif;flex:none;position:relative;user-select:none}
.pc b{font-size:17px;line-height:1}.pc i{font-style:normal;font-size:24px;line-height:1}
.pc.r{color:#b23a2e}
.pc{align-items:flex-start;padding:4px 5px}.pc i{align-self:center}
.pc.sm{padding:2px 3px}.pc.sm i{align-self:flex-start}
.handrow .pc,.pc.sm{justify-content:flex-start;gap:1px}.handrow .pc i{align-self:flex-start}
.pc.back{background:repeating-linear-gradient(45deg,#a33a3a,#a33a3a 4px,#8d2f2f 4px,#8d2f2f 8px);border:2px solid #fbf8ef}
.pc.sm{width:30px;height:43px;border-radius:5px;padding:2px 0}.pc.sm b{font-size:12px}.pc.sm i{font-size:15px}
.pc.wild:after{content:"";position:absolute;left:3px;right:3px;bottom:2px;height:3px;border-radius:2px;background:var(--gold)}
.pc.sel{transform:translateY(-14px);border:2px solid var(--gold);box-shadow:0 6px 14px rgba(0,0,0,.3)}
.stackcards{display:flex}.stackcards .pc.sm+.pc.sm{margin-left:-14px}
.meldbox{background:rgba(255,255,255,.1);border-radius:12px;padding:8px;margin-top:8px}
.meldbox.tap{outline:2px dashed var(--gold);cursor:pointer}
.meldbox .mi{font-size:11px;margin-top:4px;opacity:.9}
.mtitle{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;opacity:.85;margin-top:12px}
.banner{margin-top:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.banner.me{border-color:var(--gold);background:var(--gold-soft)}
.bar{height:7px;background:#e6e9e3;border-radius:99px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);transition:width .4s linear}
.bar i.low{background:var(--red)}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.acts .btn{flex:1;margin-top:0;min-width:120px;min-height:44px}
.handwrap{margin-top:12px;background:rgba(15,61,46,.07);border-radius:14px;padding:22px 8px 8px}
.handrow{display:flex;overflow-x:auto;padding:16px 4px 6px;-webkit-overflow-scrolling:touch}
.handrow .pc{width:52px;height:76px;cursor:pointer}.handrow .pc b{font-size:19px}.handrow .pc i{font-size:28px}
.handrow .pc+.pc{margin-left:-20px}
.lastlog{font-size:12px;color:#cfe3d8;margin-top:10px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#14231c;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;z-index:80;max-width:90%;text-align:center}
.tbl{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}.tbl td,.tbl th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}.tbl td:first-child,.tbl th:first-child{text-align:left}
.tbl tr.tot td{font-weight:800;font-size:16px;border-bottom:0}
.modal.wide{max-width:420px;text-align:left;max-height:88vh;overflow:auto}
.opt{border:2px solid var(--line);border-radius:14px;padding:10px;margin-top:10px;cursor:pointer;background:#fff;width:100%;text-align:left}
.opt:hover{border-color:var(--gold)}
</style>
</head>
<body>
<div id="app"><div class="loading"><div><div class="spin"></div><p style="margin-top:12px">Carregando…</p></div></div></div>
<input id="fotoInput" type="file" accept="image/*" style="position:fixed;left:-9999px">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="buraco-engine.js"></script>
<script>
"use strict";
var BUILD = "2026-11-06c";

var firebaseConfig = {
  apiKey: "AIzaSyB0UPpjvgSTIlT4csgUTBoi_ZK5pWG8aEU",
  authDomain: "buraco-c454c.firebaseapp.com",
  projectId: "buraco-c454c",
  storageBucket: "buraco-c454c.firebasestorage.app",
  messagingSenderId: "23866851643",
  appId: "1:23866851643:web:fb18b697d58d979f6cb71e"
};

var auth = null, db = null, FB = false;
try {
  if (typeof firebase !== "undefined" && firebase.initializeApp) {
    firebase.initializeApp(firebaseConfig); auth = firebase.auth(); db = firebase.firestore(); FB = true;
  }
} catch (e) { FB = false; }

/* ───────── Estado ───────── */
var S = {
  user: null,          // firebase user
  me: null,            // doc jogadores/{uid} + id
  meLoaded: false,
  players: [],         // todos (master) ou aprovados
  tab: "inicio",
  authTab: "login",
  registering: false,
  msg: null,           // {tipo:'ok'|'err', txt}
  form: {},            // campos digitados
  edit: null,          // edicao do perfil
  modal: null,         // jogador ampliado
  busy: false
};
var unsubMe = null, unsubPlayers = null;

/* ───────── Utilitários ───────── */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function val(id){ var el = $(id); return el ? el.value : ""; }
function initials(n){ var p = String(n||"?").trim().split(/\s+/); return ((p[0]||"?")[0] + (p.length>1 ? p[p.length-1][0] : "")).toUpperCase(); }
function primeiro(n){ return String(n||"").trim().split(/\s+/)[0] || ""; }
function nomeExib(p){ var a = (p.apelido||"").trim(), f = primeiro(p.nome); if(a && f && a.toLowerCase()!==f.toLowerCase()) return a + " · " + f; return a || f || "—"; }
function porApelido(a,b){ return (a.apelido||a.nome||"").localeCompare(b.apelido||b.nome||"","pt-BR"); }
function avatar(p, cls){ return '<div class="av '+(cls||"")+'" data-action="zoom" data-id="'+esc(p.id)+'">'+(p.foto?'<img src="'+esc(p.foto)+'" alt="">':esc(initials(p.nome)))+'</div>'; }
function isMaster(){ return !!S.me && S.me.role === "master" && S.me.status === "aprovado"; }
function fbAuthErr(e){
  var m = {
    "auth/invalid-email":"E-mail inválido.",
    "auth/user-not-found":"E-mail ou senha incorretos.",
    "auth/wrong-password":"E-mail ou senha incorretos.",
    "auth/invalid-credential":"E-mail ou senha incorretos.",
    "auth/invalid-login-credentials":"E-mail ou senha incorretos.",
    "auth/email-already-in-use":"Já existe um cadastro com esse e-mail.",
    "auth/weak-password":"Escolha uma senha com pelo menos 6 caracteres.",
    "auth/too-many-requests":"Muitas tentativas. Aguarde um pouco e tente de novo.",
    "auth/network-request-failed":"Sem conexão. Verifique sua internet.",
    "auth/popup-closed-by-user":"A janela do Google foi fechada antes de concluir.",
    "auth/cancelled-popup-request":"A janela do Google foi fechada antes de concluir.",
    "auth/popup-blocked":"O navegador bloqueou a janela do Google. Libere pop-ups e tente de novo.",
    "auth/unauthorized-domain":"Este endereço ainda não está autorizado no Firebase.",
    "auth/requires-recent-login":"Por segurança, entre de novo e repita a operação.",
    "permission-denied":"Sem permissão para essa operação."
  };
  var c = e && (e.code || ""); return m[c] || ("Algo deu errado. " + (c || (e && e.message) || ""));
}
function setMsg(tipo, txt){ S.msg = txt ? {tipo:tipo, txt:txt} : null; }
function msgHtml(){ if(!S.msg) return ""; var h = '<div class="msg '+S.msg.tipo+'" role="alert">'+esc(S.msg.txt)+'</div>'; return h; }

/* ───────── Listeners ───────── */
function stopListeners(){ if(unsubMe){ unsubMe(); unsubMe = null; } if(unsubPlayers){ unsubPlayers(); unsubPlayers = null; } if(typeof stopMesas === "function") stopMesas(); }
function listenPlayers(){
  if(unsubPlayers) return;
  var q = db.collection("jogadores");
  if(!isMaster()) q = q.where("status","==","aprovado");
  unsubPlayers = q.onSnapshot(function(snap){
    S.players = snap.docs.map(function(d){ var o = d.data(); o.id = d.id; return o; });
    render();
  }, function(){ /* sem permissao ainda */ });
}
function listenMe(uid){
  stopListeners(); S.meLoaded = false; S.me = null;
  unsubMe = db.collection("jogadores").doc(uid).onSnapshot(function(d){
    S.meLoaded = true;
    if(!d.exists){ S.me = null; render(); return; }
    S.me = d.data(); S.me.id = d.id;
    if(S.me.status === "aprovado"){
      if(unsubPlayers && isMaster() !== S._masterListen){ unsubPlayers(); unsubPlayers = null; }
      S._masterListen = isMaster(); listenPlayers(); listenMesas();
    }
    render();
  }, function(){ S.meLoaded = true; S.me = null; render(); });
}

if(FB){
  auth.onAuthStateChanged(function(u){
    if(S.registering) return;
    S.user = u;
    if(!u){ stopListeners(); S.me = null; S.meLoaded = true; S.players = []; render(); return; }
    S.edit = null; S.tab = "inicio"; listenMe(u.uid); render();
  });
} else {
  document.addEventListener("DOMContentLoaded", function(){ render(); });
}

/* ───────── Telas ───────── */
function render(){
  var app = $("app"); if(!app) return;
  var active = document.activeElement;
  if(active && /^(INPUT|SELECT|TEXTAREA)$/.test(active.tagName) && active.id && S.user && S.me && S.me.status==="aprovado" && (S.tab==="perfil" || active.id==="mesa_nome") && !S._forceRender) return; // nao interrompe digitacao
  S._forceRender = false;
  var hr0 = $("handrow"), hsl = hr0 ? hr0.scrollLeft : 0;
  var h;
  if(!FB) h = viewOffline();
  else if(!S.user && S.meLoaded === false && !S.registering && !S._authReady) { h = viewLoading(); }
  else if(!S.user) h = viewAuth();
  else if(!S.meLoaded) h = viewLoading();
  else if(!S.me) h = viewComplete();
  else if(S.me.status === "pendente") h = viewPending();
  else if(S.me.status === "recusado") h = viewRefused();
  else h = viewApp();
  app.innerHTML = h + (S.modal ? modalHtml() : "") + '<div class="build">Buraco da Família · build '+BUILD+'</div>';
  var hr1 = $("handrow"); if(hr1 && hsl) hr1.scrollLeft = hsl;
}
function viewLoading(){ return '<div class="loading"><div><div class="spin"></div><p style="margin-top:12px">Carregando…</p></div></div>'; }

function doLogin(){
  keepForm(); var em = val("li_email").trim(), se = val("li_senha");
  if(!em || !se){ setMsg("err","Informe e-mail e senha."); render(); return; }
  setMsg(); busy(true);
  auth.signInWithEmailAndPassword(em, se).then(function(){ busy(false); }).catch(function(e){ S.busy=false; setMsg("err", fbAuthErr(e)); S._forceRender = true; render(); });
}
function doRegister(){
  keepForm(); var d = dadosCadastro(), em = val("rg_email").trim(), s1 = val("rg_senha"), s2 = val("rg_senha2");
  if(d.erro){ setMsg("err", d.erro); render(); return; }
  if(!/^\S+@\S+\.\S+$/.test(em)){ setMsg("err","Informe um e-mail válido."); render(); return; }
  if(s1.length < 6){ setMsg("err","A senha precisa ter pelo menos 6 caracteres."); render(); return; }
  if(s1 !== s2){ setMsg("err","As senhas não conferem."); render(); return; }
  setMsg(); S.registering = true; busy(true);
  auth.createUserWithEmailAndPassword(em, s1)
    .then(function(cred){ return db.collection("jogadores").doc(cred.user.uid).set(docNovo(d, em, null)); })
    .then(function(){ S.registering = false; S.busy = false; S.form = {}; S.authTab = "login"; setMsg("ok","Cadastro enviado! Assim que o administrador aprovar, você entra."); return auth.signOut(); })
    .catch(function(e){ S.registering = false; S.busy = false; setMsg("err", fbAuthErr(e)); S._forceRender = true; render(); });

function changePass(){
  var at = val("pw_atual"), nv = val("pw_nova"), cf = val("pw_conf");
  if(!at){ setMsg("err","Digite a senha atual."); S._forceRender = true; render(); return; }

  if(nv !== cf){ setMsg("err","A confirmação não confere."); S._forceRender = true; render(); return; }
  var cred = firebase.auth.EmailAuthProvider.credential(S.user.email, at);
  S.user.reauthenticateWithCredential(cred).then(function(){ return S.user.updatePassword(nv); })
    .then(function(){ setMsg("ok","Senha alterada."); S._forceRender = true; render(); })
    .catch(function(er){ setMsg("err", fbAuthErr(er)); S._forceRender = true; render(); });

function resizeToDataUrl(file, max, cb){
  var r = new FileReader();
  r.onload = function(){ var img = new Image(); img.onload = function(){
    var w = img.width, h = img.height, s = Math.min(1, max / Math.max(w, h)); w = Math.round(w*s); h = Math.round(h*s);
    var c = document.createElement("canvas"); c.width = w; c.height = h; c.getContext("2d").drawImage(img, 0, 0, w, h);
    cb(c.toDataURL("image/jpeg", 0.82));
  }; img.onerror = function(){ cb(null); }; img.src = r.result; };
  r.onerror = function(){ cb(null); }; r.readAsDataURL(file);
}

var E = (typeof BuracoEngine !== "undefined") ? BuracoEngine : null;

function mySeat(m){ return (m && S.user && m.seats) ? m.seats.indexOf(S.user.uid) : -1; }
function playerByUid(uid){ for(var i=0;i<S.players.length;i++) if(S.players[i].id===uid) return S.players[i]; return null; }

function listenMesas(){
  if(unsubMesas) return;
  unsubMesas = mesasCol().where("status","in",["aguardando","jogando"]).onSnapshot(function(snap){
    S.mesas = snap.docs.map(function(d){ var o = d.data(); o.id = d.id; return o; });
    if(!S.mesaId && !S.autoDone){ for(var i=0;i<S.mesas.length;i++){ if(S.mesas[i].status==="jogando" && mySeat(S.mesas[i])>=0){ S.mesaId = S.mesas[i].id; break; } } }
    S.autoDone = true;
    var m = mesaAtual(); if(m) S.lastMesa = m;
    render();
  }, function(){ S.mesas = S.mesas || []; render(); });
}

function startGameListener(mid){

    if(d.exists){ try{ S.game = JSON.parse(d.data().json); }catch(e){} S.gameV = d.data().v || 0; cleanSel(); }

function stopGame(){ if(unsubGame){ unsubGame(); unsubGame = null; } gameFor = null; S.game = null; S.sel = []; S.picker = null; }
function ensureGameListener(){
  var m = mesaAtual();
  if(S.mesaId && m && m.status !== "aguardando" && mySeat(m) >= 0 && gameFor !== S.mesaId) startGameListener(S.mesaId);
}
function cleanSel(){ var m = S.lastMesa, g = S.game; if(!g || !m) return; var me = mySeat(m); if(me<0) return; var hand = g.players[me].hand.map(function(c){ return c.id; }); S.sel = S.sel.filter(function(id){ return hand.indexOf(id) >= 0; }); }

}
function sitAt(idx){
  var ref = mesasCol().doc(S.mesaId), uid = S.user.uid;
  db.runTransaction(function(tx){ return tx.get(ref).then(function(d){
    if(!d.exists) throw {message:"Essa mesa não existe mais."};
    var m = d.data(); if(m.status !== "aguardando") throw {message:"A partida já começou."};
    var seats = m.seats.slice(); if(seats[idx] && seats[idx] !== uid) throw {message:"Esse lugar já foi ocupado."};
    for(var i=0;i<4;i++) if(seats[i] === uid) seats[i] = null;
    seats[idx] = uid; tx.update(ref, {seats:seats});
  }); }).catch(toastErr);
}
function standUp(){
  var ref = mesasCol().doc(S.mesaId), uid = S.user.uid;
  db.runTransaction(function(tx){ return tx.get(ref).then(function(d){ if(!d.exists) return; var m = d.data(); if(m.status !== "aguardando") return; var seats = m.seats.map(function(x){ return x === uid ? null : x; }); tx.update(ref, {seats:seats}); }); }).catch(toastErr);
}
function startMatch(){
  var ref = mesasCol().doc(S.mesaId);
  db.runTransaction(function(tx){ return tx.get(ref).then(function(d){
    if(!d.exists) throw {message:"Essa mesa não existe mais."};
    var m = d.data(); if(m.status !== "aguardando") throw {message:"A partida já começou."};
    if(m.seats.some(function(x){ return !x; })) throw {message:"Faltam jogadores nos lugares."};
    var names = m.seats.map(function(u){ var p = playerByUid(u); return p ? (p.apelido || primeiro(p.nome)) : "?"; });
    var st = E.createGame({ players:names, seed:Math.floor(Math.random()*4294967296), now:Date.now() });
    tx.set(estadoRef(S.mesaId), { json:JSON.stringify(st), v:1 });
    tx.update(ref, { status:"jogando", jogadores:m.seats, iniciadaEm:firebase.firestore.FieldValue.serverTimestamp() });
  }); }).catch(toastErr);
}
function deleteMesa(){
  var id = S.mesaId; if(!confirm("Excluir esta mesa?")) return;
  estadoRef(id).delete().catch(function(){}).then(function(){ return mesasCol().doc(id).delete(); }).then(function(){ closeMesa(); }).catch(toastErr);
}
function closeMesa(){ stopGame(); S.mesaId = null; S.lastMesa = null; S._forceRender = true; render(); }

/* ── jogadas ── */
function doAct(action){
  var ref = estadoRef(S.mesaId), m = S.lastMesa;
  return db.runTransaction(function(tx){ return tx.get(ref).then(function(d){
    var st = JSON.parse(d.data().json), v = (d.data().v || 0) + 1;
    var r = E.applyAction(st, action, Date.now());
    if(!r.ok){ if(r.events && r.events.length) tx.set(ref, { json:JSON.stringify(r.state), v:v }); return { ok:false, error:r.error }; }
    tx.set(ref, { json:JSON.stringify(r.state), v:v });
    return { ok:true, state:r.state };
  }); }).then(function(res){
    if(!res.ok){ toast(res.error.message); return; }
    S.sel = []; S.picker = null;
    if(res.state.phase === "GAME_OVER" && m) mesasCol().doc(S.mesaId).update({ status:"encerrada" }).catch(function(){});
    S._forceRender = true; render();
  }).catch(toastErr);
}
function jogar(type, extra){ var m = S.lastMesa, me = mySeat(m), a = { type:type, player:me }; for(var k in (extra||{})) a[k] = extra[k]; return doAct(a); }
function checkTimeouts(){
  var g = S.game, m = S.lastMesa; if(!g || !m || S.toBusy) return;
  var me = mySeat(m); if(me < 0) return;
  if(!(g.phase === "WAITING_TURN" || g.phase === "PLAYING") || !g.turn.deadline) return;
  if(Date.now() < g.turn.deadline + 900 + me * 700) return;
  S.toBusy = true; var ref = estadoRef(S.mesaId);
  db.runTransaction(function(tx){ return tx.get(ref).then(function(d){
    var st = JSON.parse(d.data().json), evs = E.processTimeouts(st, Date.now());
    if(evs.length) tx.set(ref, { json:JSON.stringify(st), v:(d.data().v || 0) + 1 });
  }); }).catch(function(){}).then(function(){ S.toBusy = false; });
}
function layLayout(){
  var g = S.game, me = mySeat(S.lastMesa), ids = S.sel.slice();
  if(ids.length < 3){ toast("Selecione 3 ou mais cartas para baixar um jogo."); return; }
  var opts = E.getMeldOptions(g, me, ids);
  if(!opts.length){ toast("Essas cartas não formam um jogo válido."); return; }
  if(opts.length === 1) return jogar("LAY_MELD", { cardIds:ids, option:0 });
  S.picker = { kind:"lay", opts:opts, ids:ids }; S._forceRender = true; render();
}
function addToMeld(meldId){
  var g = S.game, me = mySeat(S.lastMesa);
  if(S.sel.length !== 1){ toast("Selecione 1 carta da mão e toque no jogo."); return; }
  var opts = E.getAddOptions(g, me, meldId, S.sel[0]);
  if(!opts.length){ toast("Essa carta não encaixa nesse jogo."); return; }
  if(opts.length === 1) return jogar("ADD_TO_MELD", { meldId:meldId, cardId:S.sel[0], option:0 });
  S.picker = { kind:"add", opts:opts, meldId:meldId, cardId:S.sel[0] }; S._forceRender = true; render();
}
function pickOption(i){
  var p = S.picker; if(!p) return;
  if(p.kind === "lay") jogar("LAY_MELD", { cardIds:p.ids, option:i }); else jogar("ADD_TO_MELD", { meldId:p.meldId, cardId:p.cardId, option:i });
}

/* ── telas: início (lista de mesas) ── */
function mesasPanel(){

    var avs = ""; for(var i=0;i<4;i++){ var p = m.seats[i] ? playerByUid(m.seats[i]) : null; avs += p ? avatarMini(p) : '<div class="av empty">·</div>'; }
    var n = m.seats.filter(function(x){ return x; }).length;

      '<button class="btn small '+(mine&&m.status==="jogando"?"gold":"ghost")+'" data-action="mesa-abrir" data-id="'+m.id+'">'+(mine&&m.status==="jogando"?"Voltar ao jogo":(m.status==="jogando"?"Ver":"Entrar"))+'</button></div>');

function avatarMini(p){ return '<div class="av">'+(p.foto?'<img src="'+esc(p.foto)+'" alt="">':esc(initials(p.nome)))+'</div>'; }

/* ── telas: mesa ── */
function viewMesa(){
  if(S.mesas === null) return '<div class="wrap">'+viewLoading()+'</div>';
  var m = mesaAtual();
  if(m) S.lastMesa = m;
  if(!m && S.pendingMesa === S.mesaId && Date.now() - S.pendingAt < 6000) return '<div class="wrap">'+viewLoading()+'</div>';
  if(!m && !(S.game && gameFor === S.mesaId)){ S.mesaId = null; stopGame(); return null; }
  m = m || S.lastMesa;
  ensureGameListener();
  if(m.status === "aguardando") return lobbyHtml(m);
  var me = mySeat(m);
  if(me < 0) return '<div class="wrap"><div class="panel" style="text-align:center"><h2 class="ph">Partida em andamento</h2><p class="muted" style="margin-top:8px">Você não está sentado nesta mesa.</p><button class="btn ghost" data-action="mesa-back">Voltar</button></div></div>';
  if(!S.game) return '<div class="wrap">'+viewLoading()+'</div>';
  return gameHtml(m, me);
}
function lobbyHtml(m){
  var me = mySeat(m), full = m.seats.every(function(x){ return x; }), canStart = full && (m.criadoPor === S.user.uid || isMaster());
  function seat(i){
    var p = m.seats[i] ? playerByUid(m.seats[i]) : null, mine = i === me, tm = i % 2 === 0 ? "ta" : "tb";
    if(p) return '<div class="seat taken '+tm+(mine?" mine":"")+'" '+(mine?'data-action="stand" ':"")+'>'+'<div>'+avatarMini(p)+'<div class="nm">'+esc(p.apelido||primeiro(p.nome))+(mine?'<br><span class="tm">toque p/ levantar</span>':"")+'</div></div></div>';
    return '<div class="seat '+tm+'" data-action="sit" data-id="'+i+'"><div>Sentar aqui<div class="tm">Dupla '+(i%2===0?"1":"2")+'</div></div></div>';
  }
  var h = ['<div class="wrap"><div class="gtop"><button class="btn ghost mini" data-action="mesa-back">‹ Mesas</button><span class="muted">'+esc(m.nome||"Mesa")+'</span></div>'];
  h.push('<div class="panel"><div class="eyebrow">Mesa</div><h2 class="ph">Escolha seu lugar</h2><p class="muted" style="margin-top:6px">Quem senta na frente é seu parceiro: <b>Dupla 1</b> (azul) e <b>Dupla 2</b> (laranja) jogam uma contra a outra.</p>');
  h.push('<div class="seatgrid"><div></div>'+seat(0)+'<div></div>'+seat(3)+'<div style="text-align:center;font-size:30px">🃏</div>'+seat(1)+'<div></div>'+seat(2)+'<div></div></div>');
  h.push('<div class="muted" style="margin-top:12px;text-align:center">'+m.seats.filter(function(x){return x;}).length+'/4 jogadores</div>');
  if(m.criadoPor === S.user.uid || isMaster()){
    h.push('<button class="btn" data-action="start-match"'+(canStart?"":" disabled")+'>Começar partida</button>');
    h.push('<button class="btn ghost" data-action="del-mesa">Excluir mesa</button>');
  } else h.push('<p class="muted" style="margin-top:12px;text-align:center">Quem criou a mesa começa a partida.</p>');
  h.push('</div></div>');
  return h.join("") + (S.toast ? '<div class="toast">'+esc(S.toast)+'</div>' : "");
}

function cardHtml(c, cls, attrs){ return '<div class="pc '+((c.suit==="H"||c.suit==="D")?"r ":"")+(cls||"")+'" '+(attrs||"")+'><b>'+c.rank+'</b><i>'+SYM[c.suit]+'</i></div>'; }
function posLabel(p){ return p === 1 || p === 14 ? "A" : (p === 11 ? "J" : p === 12 ? "Q" : p === 13 ? "K" : String(p)); }
function entriesHtml(entries){ return '<div class="stackcards">'+entries.map(function(e){ var c = { rank:e.card.rank, suit:e.card.suit }; var lab = e.wild ? { rank:e.card.rank, suit:e.card.suit } : c; return cardHtml(lab, "sm"+(e.wild?" wild":"")); }).join("")+'</div>'; }
function meldInfoText(meld){
  var i = E.meldInfo(meld);
  if(i.isCanastra) return (i.kind==="suja"?"Canastra suja":i.kind==="limpa"?"Canastra limpa":i.kind==="c500"?"Canastra de 13":"Canastra A→A")+" · +"+i.bonus;
  return i.size+" cartas"+(i.wilds?" · coringa":"");
}
function meldHtml(meld, tap){
  var i = E.meldInfo(meld);
  return '<div class="meldbox'+(tap?" tap":"")+'" '+(tap?'data-action="meld-add" data-id="'+meld.id+'"':"")+'>'+entriesHtml(meld.cards)+'<div class="mi">'+(i.isCanastra?"⭐ ":"")+meldInfoText(meld)+'</div></div>';
}
function sortedHand(hand){
  var so = {S:0,H:1,C:2,D:3}, v = function(c){ return c.rank==="A"?1:c.rank==="J"?11:c.rank==="Q"?12:c.rank==="K"?13:parseInt(c.rank,10); };
  return hand.slice().sort(S.sortMode==="rank" ? function(a,b){ return v(a)-v(b) || so[a.suit]-so[b.suit] || a.id-b.id; } : function(a,b){ return so[a.suit]-so[b.suit] || v(a)-v(b) || a.id-b.id; });
}
function oppChip(g, m, i, me, partner){
  var p = m.seats[i] ? playerByUid(m.seats[i]) : null, tm = i%2===0?"A":"B", mt = me%2===0?"A":"B";
  var turn = g.turn.player === i && (g.phase==="WAITING_TURN"||g.phase==="PLAYING");
  var morto = g.teams[tm].mortoTaken ? "morto ✓" : (g.teams[tm].mortoLost ? "sem morto" : "");
  return '<div class="chip'+(turn?" turn":"")+'">'+(partner?'<span class="tag">parceiro</span>':"")+(p?avatarMini(p):'<div class="av">?</div>')+'<div class="nm">'+esc(g.players[i].name)+'</div><div class="ct">'+g.players[i].hand.length+' cartas'+(morto?' · '+morto:"")+'</div></div>';
}
function mortoTxt(g, team){ var t = g.teams[team]; return t.mortoTaken ? "pego" : (t.mortoLost ? "perdido" : "intacto"); }
function logTxt(g, e){
  var n = function(i){ return g.players[i] ? g.players[i].name : "?"; };
  switch(e.type){
    case "DREW_STOCK": return n(e.player)+" comprou do monte";
    case "DREW_DISCARD": return n(e.player)+" pegou o lixo ("+e.cards+" cartas)";
    case "MELD_LAID": return n(e.player)+" baixou um jogo de "+e.size;
    case "CARD_ADDED": return n(e.player)+" adicionou carta (jogo de "+e.size+")";
    case "DISCARDED": return n(e.player)+" descartou "+E.cardLabel(e.card);
    case "MORTO_EM_PE": return n(e.player)+" pegou o morto em pé";
    case "MORTO_DESCARTE": return n(e.player)+" pegou o morto";
    case "MORTO_VIRA_MONTE": return "O morto da dupla "+(e.owner==="A"?"1":"2")+" virou monte";
    case "MONTE_ACABOU_SEM_MORTO": return "O monte acabou: a rodada termina nesta vez";
    case "TIMEOUT_COMPRA": return n(e.player)+" ficou sem tempo (compra automática)";
    case "TIMEOUT_JOGADA": return n(e.player)+" ficou sem tempo (descarte automático)";
    case "ROUND_OVER": return "Fim da rodada";
    case "GAME_OVER": return "Fim da partida";
    case "ROUND_STARTED": return "Rodada "+e.round+" começou";
  } return null;
}
function timerInfo(g){
  if(!(g.phase==="WAITING_TURN"||g.phase==="PLAYING") || !g.turn.deadline) return { left:0, pct:0 };
  var total = (g.phase==="WAITING_TURN" ? g.config.drawSeconds : g.config.playSeconds) * 1000, left = Math.max(0, g.turn.deadline - Date.now());
  return { left:Math.ceil(left/1000), pct:Math.min(100, left/total*100) };
}
function gameHtml(m, me){
  var g = S.game, team = me%2===0?"A":"B", opp = team==="A"?"B":"A";
  var active = (g.phase==="WAITING_TURN"||g.phase==="PLAYING"), myTurn = active && g.turn.player === me, ti = timerInfo(g);
  var h = ['<div class="wrap game">'];
  h.push('<div class="gtop"><button class="btn ghost mini" data-action="mesa-back">‹ Mesas</button><div class="score"><span class="sc me">Nós <b>'+g.scores[team]+'</b></span><span class="sc">Eles <b>'+g.scores[opp]+'</b></span></div><span class="muted" style="font-size:12px">R'+g.round+' · '+g.config.targetScore+'</span></div>');
  h.push('<div class="opps">'+oppChip(g,m,(me+1)%4,me)+oppChip(g,m,(me+2)%4,me,true)+oppChip(g,m,(me+3)%4,me)+'</div>');
  // centro
  var top = g.discard.length ? g.discard[g.discard.length-1] : null;
  h.push('<div class="felt"><div class="center">'+
    '<div class="pile"><div class="pc back"></div><div class="cap">Monte · '+g.stock.length+'</div></div>'+
    '<div class="pile">'+(top?cardHtml(top,""):'<div class="pc" style="opacity:.25;background:none;border-style:dashed"></div>')+'<div class="cap">Lixo · '+g.discard.length+'</div></div>'+
    '<div class="pile" style="font-size:12px;line-height:1.7">Morto nosso: <b>'+mortoTxt(g,team)+'</b><br>Morto deles: <b>'+mortoTxt(g,opp)+'</b></div></div>');
  var lg = (g.log||[]).map(function(e){ return logTxt(g,e); }).filter(Boolean).slice(-4);
  if(lg.length) h.push('<div class="lastlog">'+lg.map(esc).join("<br>")+'</div>');
  var tap = myTurn && g.phase==="PLAYING" && S.sel.length===1;
  h.push('<div class="mtitle">Nossos jogos</div>');
  g.teams[team].melds.forEach(function(ml){ h.push(meldHtml(ml, tap)); });
  if(!g.teams[team].melds.length) h.push('<div class="mi" style="opacity:.7;margin-top:6px">Nenhum jogo baixado</div>');
  h.push('<div class="mtitle">Jogos deles</div>');
  g.teams[opp].melds.forEach(function(ml){ h.push(meldHtml(ml, false)); });
  if(!g.teams[opp].melds.length) h.push('<div class="mi" style="opacity:.7;margin-top:6px">Nenhum jogo baixado</div>');
  h.push('</div>');
  // banner
  if(active){
    var who = g.players[g.turn.player].name, what = g.phase==="WAITING_TURN" ? "comprar" : "jogar";
    h.push('<div class="banner'+(myTurn?" me":"")+'"><b>'+(myTurn?"Sua vez":"Vez de "+esc(who))+'</b> · '+what+' <span id="tnum" style="float:right;font-weight:800">'+ti.left+'s</span><div class="bar"><i id="tbar" style="width:'+ti.pct+'%"></i></div></div>');
  }
  // ações
  if(myTurn){
    h.push('<div class="acts">');
    if(g.phase==="WAITING_TURN"){
      h.push('<button class="btn" data-action="g-stock">Comprar do monte</button><button class="btn gold" data-action="g-discard"'+(g.discard.length?"":" disabled")+'>Pegar o lixo ('+g.discard.length+')</button>');
    } else {
      h.push('<button class="btn" data-action="g-lay"'+(S.sel.length>=3?"":" disabled")+'>Baixar jogo'+(S.sel.length>=3?" ("+S.sel.length+")":"")+'</button><button class="btn danger" data-action="g-throw"'+(S.sel.length===1?"":" disabled")+'>Descartar</button>');
    }
    h.push('</div>');
    if(g.phase==="PLAYING") h.push('<p class="muted" style="margin-top:8px">'+(S.sel.length===1?"Toque num jogo nosso para adicionar a carta, ou descarte para encerrar a vez.":"Toque nas cartas para selecionar.")+'</p>');
  }
  // mão
  var mine = sortedHand(g.players[me].hand);
  h.push('<div class="handwrap"><div style="display:flex;justify-content:space-between;align-items:center"><span class="eyebrow">Sua mão · '+mine.length+'</span><button class="link" data-action="g-sort">Ordenar por '+(S.sortMode==="suit"?"número":"naipe")+'</button></div><div class="handrow" id="handrow">'+
    mine.map(function(c){ return cardHtml(c, S.sel.indexOf(c.id)>=0?"sel":"", 'data-action="g-sel" data-id="'+c.id+'"'); }).join("")+'</div></div>');
  h.push('</div>');
  var out = h.join("");
  if(S.picker) out += pickerHtml();
  if(g.phase==="ROUND_OVER" || g.phase==="GAME_OVER") out += endHtml(g, team, opp);
  if(S.toast) out += '<div class="toast">'+esc(S.toast)+'</div>';
  return out;
}
function pickerHtml(){
  var p = S.picker, h = ['<div class="modalbg"><div class="modal wide"><h3>Como colocar?</h3><p class="muted" style="margin-top:4px">Há mais de uma forma de encaixar. Escolha:</p>'];
  p.opts.forEach(function(o,i){
    var w = o.entries.filter(function(e){ return e.wild; })[0];
    h.push('<button class="opt" data-action="pick-opt" data-id="'+i+'">'+entriesHtml(o.entries)+'<div class="muted" style="margin-top:6px">'+(o.clean?"Jogo limpo":("Coringa no lugar do "+posLabel(w.pos)))+'</div></button>');
  });
  h.push('<button class="btn ghost" data-action="pick-cancel">Cancelar</button></div></div>');
  return h.join("");
}
function endHtml(g, team, opp){
  var r = g.roundResult, d = r.detail, over = g.phase === "GAME_OVER", win = g.winner === team;
  var rows = [["Morto","morto"],["Batida","batida"],["Cartas","cartas"]];
  var h = ['<div class="modalbg"><div class="modal wide"><h3>'+(over?(win?"🏆 Vitória!":"Fim de jogo"):"Fim da rodada")+'</h3><p class="muted" style="margin-top:4px">'+(r.reason==="BATIDA"?esc(g.players[r.by].name)+" bateu!":"O monte acabou.")+'</p>'];
  h.push('<table class="tbl"><tr><th></th><th>Nós</th><th>Eles</th></tr>');
  rows.forEach(function(x){ h.push('<tr><td>'+x[0]+'</td><td>'+d[team][x[1]]+'</td><td>'+d[opp][x[1]]+'</td></tr>'); });
  [["Canastra suja","suja"],["Canastra limpa","limpa"],["Canastra 500","c500"],["Canastra 1000","c1000"]].forEach(function(x){
    if(d[team][x[1]].count || d[opp][x[1]].count) h.push('<tr><td>'+x[0]+'</td><td>'+d[team][x[1]].points+' <span class="muted">('+d[team][x[1]].count+')</span></td><td>'+d[opp][x[1]].points+' <span class="muted">('+d[opp][x[1]].count+')</span></td></tr>');
  });
  h.push('<tr class="tot"><td>Rodada</td><td>'+d[team].total+'</td><td>'+d[opp].total+'</td></tr>');
  h.push('<tr class="tot"><td>Placar</td><td>'+r.scoresAfter[team]+'</td><td>'+r.scoresAfter[opp]+'</td></tr></table>');
  h.push(over ? '<button class="btn" data-action="mesa-back">Voltar às mesas</button>' : '<button class="btn" data-action="g-next">Próxima rodada</button>');
  h.push('</div></div>');
  return h.join("");
}

/* relógio: atualiza a barra sem redesenhar e dispara timeouts */

document.addEventListener("click", function(ev){
  var el = ev.target.closest("[data-action]"); if(!el) return;
  if(el.getAttribute("data-action") === "close-modal" && ev.target.closest("[data-stop]") && !ev.target.closest("button")) return;
  var act = el.getAttribute("data-action"), id = el.getAttribute("data-id");
  switch(act){
    case "reload": location.reload(); break;
    case "mesa-criar": criarMesa(); break;
    case "mesa-abrir": S.mesaId = id; S._forceRender = true; render(); break;
    case "mesa-back": closeMesa(); break;
    case "sit": sitAt(parseInt(id,10)); break;
    case "stand": standUp(); break;
    case "start-match": startMatch(); break;
    case "del-mesa": deleteMesa(); break;
    case "g-sel": var cid = parseInt(id,10), ix = S.sel.indexOf(cid); if(ix>=0) S.sel.splice(ix,1); else S.sel.push(cid); S._forceRender = true; render(); break;
    case "g-sort": S.sortMode = S.sortMode==="suit" ? "rank" : "suit"; S._forceRender = true; render(); break;
    case "g-stock": jogar("DRAW_STOCK"); break;
    case "g-discard": jogar("DRAW_DISCARD"); break;
    case "g-lay": layLayout(); break;
    case "g-throw": if(S.sel.length===1) jogar("DISCARD", { cardId:S.sel[0] }); break;
    case "meld-add": addToMeld(parseInt(id,10)); break;
    case "pick-opt": pickOption(parseInt(id,10)); break;
    case "pick-cancel": S.picker = null; S._forceRender = true; render(); break;
    case "g-next": jogar("START_NEXT_ROUND"); break;
    case "tab": setMsg(); S.tab = id; S._forceRender = true; render(); break;
    case "tab-reg": keepForm(); setMsg(); S.authTab = "reg"; render(); break;
    case "tab-login": keepForm(); setMsg(); S.authTab = "login"; render(); break;
    case "login": doLogin(); break;
    case "register": doRegister(); break;
    case "complete": doComplete(); break;
    case "google": doGoogle(); break;
    case "forgot": doForgot(); break;
    case "logout": setMsg(); S.form = {}; auth.signOut(); break;
    case "save-perfil": savePerfil(); break;
    case "change-pass": changePass(); break;
    case "pick-foto": $("fotoInput").click(); break;
    case "rem-foto": setFoto(null); break;
    case "zoom": var p = (S.me && S.me.id===id) ? S.me : playerById(id); if(p){ S.modal = p; S._forceRender = true; render(); } break;
    case "close-modal": S.modal = null; S._forceRender = true; render(); break;
    case "approve": masterSet(id, { status:"aprovado" }, "Cadastro aprovado."); break;
    case "reject": masterSet(id, { status:"recusado" }, "Cadastro recusado."); break;
    case "remove": var q = playerById(id); if(q && confirm("Remover "+(q.apelido||q.nome)+" da família? Ele(a) poderá pedir acesso de novo.")){ db.collection("jogadores").doc(id).delete().then(function(){ setMsg("ok","Jogador removido."); S._forceRender = true; render(); }).catch(function(er){ setMsg("err", fbAuthErr(er)); S._forceRender = true; render(); }); } break;
    case "reset-link": var r = playerById(id); if(r && r.email){ auth.sendPasswordResetEmail(r.email).then(function(){ setMsg("ok","Link de redefinição enviado para "+r.email+"."); S._forceRender = true; render(); }).catch(function(er){ setMsg("err", fbAuthErr(er)); S._forceRender = true; render(); }); } break;
  }
});
document.addEventListener("keydown", function(ev){
  if(ev.key !== "Enter") return;
  var id = ev.target && ev.target.id; if(!id) return;
  if(id === "li_email" || id === "li_senha") doLogin();
});
$("fotoInput").addEventListener("change", function(ev){
  var f = ev.target.files && ev.target.files[0]; ev.target.value = ""; if(!f || !S.me) return;
  resizeToDataUrl(f, 320, function(url){ if(!url){ setMsg("err","Não consegui ler essa imagem."); S._forceRender = true; render(); return; } setFoto(url); });
});
document.addEventListener("visibilitychange", function(){ if(!document.hidden && !(document.activeElement && /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName))){ S._forceRender = true; render(); } });
setTimeout(function(){ S._authReady = true; render(); }, 4000);
render();
</script>
</body>
</html>
