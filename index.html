<style>
:root{
  --felt:#0f3d2e; --felt-deep:#0b2e22; --felt-soft:#e8f1ec; --paper:#f5f3ec; --ink:#14231c;
  --ink-soft:#5d6b63; --line:#e1e5de; --gold:#c9a13b; --gold-soft:#fbf3dc; --red:#b23a2e; --red-soft:#fbe9e7;
  --ok:#1f7a44; --shadow:0 10px 30px rgba(10,40,28,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:'Inter',system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit;font-size:16px}
:focus-visible{outline:2.5px solid var(--gold);outline-offset:2px;border-radius:8px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
img{max-width:100%}
.wrap{max-width:920px;margin:0 auto;padding:env(safe-area-inset-top) max(16px,env(safe-area-inset-right)) 80px max(16px,env(safe-area-inset-left))}
.wrap.auth{max-width:440px;padding-top:28px}
.brand{text-align:center;margin:8px 0 22px}
.brand .logo{width:72px;height:72px;border-radius:20px;background:var(--felt);color:#f4efe0;display:inline-grid;place-items:center;font-size:44px;box-shadow:var(--shadow);border:2px solid var(--gold)}
.brand h1{font-family:'Archivo',sans-serif;font-weight:900;font-size:28px;margin-top:12px;letter-spacing:-.5px}
.brand p{color:var(--ink-soft);margin-top:4px;font-size:15px}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:14px;box-shadow:var(--shadow)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.ph{font-family:'Archivo',sans-serif;font-weight:800;font-size:21px;margin-top:2px}
.muted{color:var(--ink-soft);font-size:14px;line-height:1.45}
label.f{display:block;margin-top:14px;font-size:13px;font-weight:600;color:var(--ink-soft)}
.in{width:100%;margin-top:6px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.in:focus{border-color:var(--felt);outline:none}
.in[readonly]{background:#f3f4f1;color:var(--ink-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border:0;border-radius:12px;background:var(--felt);color:#fff;font-weight:700;cursor:pointer;width:100%;margin-top:16px}
.btn:hover{background:var(--felt-deep)}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{background:var(--felt-soft)}
.btn.gold{background:var(--gold);color:#241a02}
.btn.danger{background:var(--red)}
.btn.small,.btn.mini{width:auto;min-height:36px;padding:0 12px;font-size:14px;margin-top:0}
.btn.mini{min-height:32px;padding:0 10px;font-size:13px}
.btn.ok{background:var(--ok)}
.link{background:none;border:0;color:var(--felt);font-weight:600;cursor:pointer;text-decoration:underline;font-size:14px}
.tabs{display:flex;gap:6px;margin:16px 0 0;overflow-x:auto}
.tab{flex:1;min-width:max-content;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:700;color:var(--ink-soft);cursor:pointer;position:relative}
.tab.on{background:var(--felt);color:#fff;border-color:var(--felt)}
@media(hover:hover){.tab:not(.on):hover{background:var(--felt-soft)}}
.dot{position:absolute;top:6px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--red)}
.msg{padding:11px 14px;border-radius:12px;margin-top:14px;font-size:14px;line-height:1.4}
.msg.err{background:var(--red-soft);color:#7a1f16}
.msg.ok{background:var(--felt-soft);color:#0d4a2c}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 0 4px;gap:10px}
.topbar .who{display:flex;align-items:center;gap:10px;min-width:0}
.topbar .name{font-weight:700;line-height:1.1}
.topbar .sub{font-size:12px;color:var(--ink-soft)}
.av{width:44px;height:44px;border-radius:50%;background:var(--felt);color:#f4efe0;display:grid;place-items:center;font-weight:800;overflow:hidden;flex:none;border:2px solid var(--gold);cursor:pointer}
.av img{width:100%;height:100%;object-fit:cover}
.av.sm{width:38px;height:38px;font-size:14px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child,.ph + .row{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:13px;color:var(--ink-soft)}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--felt-soft);color:var(--felt)}
.badge.m{background:var(--gold-soft);color:#7a5a06}
.badge.p{background:var(--red-soft);color:var(--red)}
.photoedit{display:flex;align-items:center;gap:14px;margin-top:14px}
.photobig{width:84px;height:84px;border-radius:50%;background:var(--felt);color:#f4efe0;display:grid;place-items:center;font-size:28px;font-weight:800;overflow:hidden;border:3px solid var(--gold)}
.photobig img{width:100%;height:100%;object-fit:cover}
.modalbg{position:fixed;inset:0;background:rgba(5,25,17,.65);display:grid;place-items:center;padding:18px;z-index:50}
.modal{background:#fff;border-radius:20px;padding:22px;max-width:360px;width:100%;text-align:center}
.modal .big{width:200px;height:200px;border-radius:50%;margin:0 auto 14px;background:var(--felt);color:#f4efe0;display:grid;place-items:center;font-size:64px;font-weight:800;overflow:hidden;border:4px solid var(--gold)}
.modal .big img{width:100%;height:100%;object-fit:cover}
.modal h3{font-family:'Archivo',sans-serif;font-weight:800;font-size:22px}
.soon{display:grid;place-items:center;text-align:center;padding:26px 10px;border:2px dashed var(--line);border-radius:16px;margin-top:12px;color:var(--ink-soft)}
.soon .big{font-size:40px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--felt-soft);border-radius:14px;padding:12px 6px;text-align:center}
.stat b{display:block;font-family:'Archivo',sans-serif;font-size:22px}
.stat span{font-size:12px;color:var(--ink-soft)}
.build{text-align:center;font-size:11px;color:#9aa59e;margin-top:26px}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--ink-soft);text-align:center;gap:10px}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--felt);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.or{display:flex;align-items:center;gap:10px;margin:16px 0 0;color:var(--ink-soft);font-size:13px}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.gbtn{background:#fff;color:var(--ink);border:1.5px solid var(--line);margin-top:12px}
.gbtn:hover{background:#f6f6f3}
/* ───── Mesas e jogo ───── */
.seatgrid{display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:auto auto auto;gap:10px;margin-top:14px;align-items:center}
.seat{border:2px dashed var(--line);border-radius:16px;padding:10px 6px;text-align:center;min-height:104px;display:grid;place-items:center;background:#fff;cursor:pointer;font-weight:700;color:var(--ink-soft)}
.seat.taken{border-style:solid;cursor:default;color:var(--ink)}
.seat.mine{border-color:var(--gold);background:var(--gold-soft)}
.seat .nm{font-size:13px;margin-top:6px;line-height:1.1}
.seat.ta{box-shadow:inset 0 -4px 0 #2d6cdf}.seat.tb{box-shadow:inset 0 -4px 0 #c0572b}
.seat .tm{font-size:11px;font-weight:700;opacity:.7}
.mesaitem{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.mesaitem:first-of-type{border-top:0}
.avs{display:flex}.avs .av{width:30px;height:30px;font-size:11px;margin-left:-8px;cursor:default;border-width:2px}.avs .av:first-child{margin-left:0}
.avs .empty{background:#e9ece8;color:#9aa59e;border-color:#fff}
body.ingame{overflow:hidden;position:fixed;inset:0;width:100%}
.gscreen{height:100vh;height:100dvh;display:flex;flex-direction:column;padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(22px,calc(env(safe-area-inset-bottom) + 10px)) max(14px,env(safe-area-inset-left));max-width:560px;margin:0 auto;gap:6px;overflow:hidden;position:relative}
.gtop{display:flex;align-items:center;gap:6px;flex:none;padding:0}
.gtop .score{flex:1;justify-content:center}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:16px;cursor:pointer;flex:none;line-height:1}
.iconbtn.on{background:var(--gold-soft);border-color:var(--gold)}
.sc{background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;white-space:nowrap}.sc b{font-family:'Archivo',sans-serif;font-size:15px}.sc.me{background:var(--felt);color:#fff;border-color:var(--felt)}
.score{display:flex;gap:6px}
.opps{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;flex:none}
.chip{display:flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:4px 6px;font-size:11px;position:relative;min-width:0}
.chip.turn{border-color:var(--gold);background:var(--gold-soft)}
.chip.pulse{animation:chipPulse .9s ease-out}
@keyframes chipPulse{0%{transform:scale(1.07);box-shadow:0 0 0 0 rgba(201,161,59,.7)}100%{transform:scale(1);box-shadow:0 0 0 12px rgba(201,161,59,0)}}
.chip .av{width:28px;height:28px;font-size:10px;margin:0;flex:none;border-width:2px;cursor:default}
.chip .txt{min-width:0;line-height:1.15}
.chip .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.chip .ct{color:var(--ink-soft);font-size:11px}
.chip .tag{position:absolute;top:-7px;right:6px;font-size:9px;background:var(--felt);color:#fff;border-radius:999px;padding:0 6px}
.felt{flex:1;min-height:0;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 20%,#1b6a4d,#0f3d2e);border-radius:16px;padding:8px;color:#f4efe0;overflow:hidden;gap:6px}
.center{display:flex;gap:8px;align-items:flex-start;flex:none}
.pile{flex:none;text-align:center;font-size:10px;line-height:1.2}
.pile.tapok{cursor:pointer}
.pile.tapok .pc{box-shadow:0 0 0 2px var(--gold),0 0 14px rgba(230,193,90,.6)}
.discardbox{flex:1;min-width:0;border-radius:10px;padding:2px 3px}
.discardbox.tapok{cursor:pointer;outline:2px solid var(--gold);outline-offset:1px}
.discardbox .cap{font-size:10px;opacity:.9;margin-top:2px}
.fanrow{display:flex}
.fanrow+.fanrow{margin-top:3px}
.mortos{flex:none;font-size:10px;line-height:1.35;text-align:center}
.mortos .stk{display:flex;justify-content:center;margin-bottom:3px}
.mortos .stk .pc+.pc{margin-left:-14px}
.lastact{flex:none;min-height:24px;font-size:12px;display:flex;align-items:center;gap:6px;color:#e8f3ec;animation:fadeIn .4s}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
#meldarea{flex:1;min-height:0;display:grid;grid-template-rows:1fr 1fr;gap:6px;overflow:hidden}
.mhalf{min-height:0;overflow:hidden;border-radius:10px;padding:3px 6px}
.mhalf.ta{background:rgba(45,108,223,.16);box-shadow:inset 0 0 0 1.5px rgba(130,175,255,.45)}
.mhalf.tb{background:rgba(224,110,55,.15);box-shadow:inset 0 0 0 1.5px rgba(255,170,120,.45)}
.mhalf.us .mtitle{opacity:1}
.mtitle{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.8;margin:2px 0 3px}
.meldwrap{display:flex;flex-wrap:wrap;align-items:flex-start}
.meldbox{--cw:calc(24px*var(--ms,1));background:rgba(255,255,255,.12);border-radius:8px;padding:3px 4px;margin:0 4px 4px 0;font-size:calc(9px*var(--ms,1))}
.meldbox.tap{outline:2px dashed var(--gold);cursor:pointer}
.meldbox.pulse{animation:chipPulse .9s ease-out}
.meldbox .mi{margin-top:2px;opacity:.9;white-space:nowrap}
.stackcards{display:flex}
.stackcards .pc+.pc{margin-left:calc(var(--cw)*-.52)}
.pc{width:var(--cw,44px);height:calc(var(--cw,44px)*1.42);border-radius:calc(var(--cw,44px)*.15);background:#fbf8ef;border:1px solid #cfc8b2;color:#14231c;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:0;padding:calc(var(--cw,44px)*.06) calc(var(--cw,44px)*.1);font-family:'Archivo',sans-serif;flex:none;position:relative;user-select:none;line-height:1}
.pc b{font-size:calc(var(--cw,44px)*.42)}.pc i{font-style:normal;font-size:calc(var(--cw,44px)*.44)}
.pc.r{color:#b23a2e}
.pc.back{background:repeating-linear-gradient(45deg,#a33a3a,#a33a3a 4px,#8d2f2f 4px,#8d2f2f 8px);border:2px solid #fbf8ef}
.pc.wild:after{content:"";position:absolute;left:12%;right:12%;bottom:3%;height:calc(var(--cw)*.1);border-radius:2px;background:var(--gold)}
.pc.sel{transform:translateY(-10px);border:2px solid var(--gold);box-shadow:0 6px 12px rgba(0,0,0,.3);z-index:2}
.pc.new{animation:newGlow 2.4s ease-out}
@keyframes newGlow{0%{z-index:5;transform:translateY(-16px) scale(1.18);box-shadow:0 0 0 3px var(--gold),0 0 20px var(--gold)}40%{transform:translateY(-8px) scale(1.08);box-shadow:0 0 0 3px var(--gold),0 0 14px var(--gold)}100%{transform:none;box-shadow:0 0 0 0 transparent;z-index:auto}}
.pc.land{animation:landIn .7s ease-out}
@keyframes landIn{0%{transform:translateY(-26px) scale(1.5) rotate(-8deg);box-shadow:0 0 0 3px var(--gold),0 0 22px var(--gold)}60%{transform:scale(1.1)}100%{transform:none;box-shadow:none}}
.flyc{--cw:40px}
.statusrow{flex:none;display:flex;align-items:center;gap:8px;font-size:13px;min-height:22px}
.statusrow b{font-weight:800}
.statusrow .muted{font-size:12px}
.badgeoff{background:var(--red);color:#fff;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700}
.acts{flex:none;display:flex;gap:6px}
.acts .btn{flex:1;margin-top:0;min-height:42px;min-width:0;padding:0 8px;font-size:14px}
.handwrap{flex:none;background:rgba(15,61,46,.08);border-radius:14px;padding:4px 6px 6px}
.handhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:0;font-size:11px}
.hrow{--cw:44px;display:flex;padding-top:12px}
.hrow+.hrow{padding-top:2px}
.hrow .pc{cursor:pointer}
.tbl{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}.tbl td,.tbl th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}.tbl td:first-child,.tbl th:first-child{text-align:left}
.tbl tr.tot td{font-weight:800;font-size:16px;border-bottom:0}
.modal.wide{max-width:420px;text-align:left;max-height:88vh;overflow:auto}
.modal.wide h3{font-family:'Archivo',sans-serif}
.opt{border:2px solid var(--line);border-radius:14px;padding:10px;margin-top:10px;cursor:pointer;background:#fff;width:100%;text-align:left;--cw:30px}
.opt:hover{border-color:var(--gold)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#14231c;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;z-index:90;max-width:90%;text-align:center}
.votebar{flex:none;background:var(--gold-soft);border:1.5px solid var(--gold);border-radius:12px;padding:6px 8px;font-size:12px;display:flex;align-items:center;gap:6px}
.votebar span{flex:1}
.votebar .btn{width:auto;margin:0;min-height:30px;padding:0 10px;font-size:12px}

.cb{display:inline-block;font-weight:800;font-size:calc(9px*var(--ms,1));letter-spacing:.03em;padding:1px 7px;border-radius:999px;white-space:nowrap}
.cb.limpa{background:#1f9d55;color:#fff}
.cb.suja{background:#b5651d;color:#fff}
.cb.c500{background:linear-gradient(90deg,#6d28d9,#a855f7);color:#fff}
.cb.c1000{background:linear-gradient(90deg,#f59e0b,#fde047,#f59e0b);background-size:200% 100%;color:#3b2a00;animation:shimmer 1.6s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.meldbox.k-limpa{box-shadow:0 0 0 2px #35c47a,0 0 10px rgba(53,196,122,.45)}
.meldbox.k-suja{box-shadow:0 0 0 2px #d9822b}
.meldbox.k-c500{box-shadow:0 0 0 2px #a974ff,0 0 12px rgba(169,116,255,.6)}
.meldbox.k-c1000{box-shadow:0 0 0 2px #ffd24a,0 0 16px rgba(255,210,74,.85)}
.meldbox.fresh-lay{animation:meldDrop 1.2s cubic-bezier(.2,1.3,.4,1);position:relative;z-index:4}
@keyframes meldDrop{0%{transform:translateY(-80px) scale(1.7);opacity:0}30%{opacity:1;box-shadow:0 0 0 6px #ffd24a,0 0 40px #ffd24a}65%{transform:scale(.95)}100%{transform:none}}
.meldbox.fresh-lay .pc{animation:cardPop .55s cubic-bezier(.2,1.5,.4,1) both}
.stackcards .pc:nth-child(2){animation-delay:.06s!important}.stackcards .pc:nth-child(3){animation-delay:.12s!important}.stackcards .pc:nth-child(4){animation-delay:.18s!important}.stackcards .pc:nth-child(5){animation-delay:.24s!important}.stackcards .pc:nth-child(6){animation-delay:.3s!important}.stackcards .pc:nth-child(n+7){animation-delay:.36s!important}
@keyframes cardPop{0%{transform:translateY(-34px) scale(1.5) rotate(-6deg);opacity:0}100%{transform:none;opacity:1}}
.meldbox.fresh-add{animation:addGlow 1.1s ease-out;position:relative;z-index:4}
@keyframes addGlow{0%{transform:scale(1.14);box-shadow:0 0 0 4px #ffd24a,0 0 26px #ffd24a}100%{transform:none}}
.banner{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%);z-index:80;pointer-events:none;text-align:center;padding:14px 22px;border-radius:18px;font-family:'Archivo',sans-serif;font-weight:800;font-size:24px;line-height:1.15;color:#fff;box-shadow:0 10px 40px rgba(0,0,0,.45);animation:bannerIn 2.2s ease-out forwards;max-width:86vw}
.banner small{display:block;font-size:13px;font-weight:700;opacity:.9;margin-top:3px}
.banner.limpa{background:linear-gradient(135deg,#16a34a,#22c55e)}.banner.suja{background:linear-gradient(135deg,#b45309,#d97706)}.banner.c500{background:linear-gradient(135deg,#6d28d9,#a855f7)}.banner.c1000{background:linear-gradient(135deg,#f59e0b,#fde047);color:#3b2a00}
@keyframes bannerIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}22%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
.turnbar{flex:1;background:linear-gradient(90deg,#f2c94c,#ffe18a);color:#2b1d00;border-radius:12px;padding:8px 12px;font-weight:800;font-size:14px;animation:turnPulse 1.1s ease-in-out infinite;text-align:center}

.gscreen.mt:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:6;box-shadow:inset 0 0 0 3px rgba(242,201,76,.95),inset 0 0 34px rgba(242,201,76,.6);animation:edgePulse 1.4s ease-in-out infinite}

<body>
<div id="app"><div class="loading"><div><div class="spin"></div><p style="margin-top:12px">Carregando…</p></div></div></div>
<input id="fotoInput" type="file" accept="image/*" style="position:fixed;left:-9999px">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="buraco-engine.js"></script>
<script src="buraco-bot.js"></script>
<script>
"use strict";
var BUILD = "2026-11-07c";

var firebaseConfig = {
  apiKey: "AIzaSyB0UPpjvgSTIlT4csgUTBoi_ZK5pWG8aEU",
  authDomain: "buraco-c454c.firebaseapp.com",
  projectId: "buraco-c454c",
  storageBucket: "buraco-c454c.firebasestorage.app",
  messagingSenderId: "23866851643",
  appId: "1:23866851643:web:fb18b697d58d979f6cb71e"
};

var auth = null, db = null, FB = false;
try {
  if (typeof firebase !== "undefined" && firebase.initializeApp) {
    firebase.initializeApp(firebaseConfig); auth = firebase.auth(); db = firebase.firestore(); FB = true;
  }
} catch (e) { FB = false; }

/* ───────── Estado ───────── */
var S = {
  user: null,          // firebase user
  me: null,            // doc jogadores/{uid} + id
  meLoaded: false,
  players: [],         // todos (master) ou aprovados
  tab: "inicio",
  authTab: "login",
  registering: false,
  msg: null,           // {tipo:'ok'|'err', txt}
  form: {},            // campos digitados
  edit: null,          // edicao do perfil
  modal: null,         // jogador ampliado
  busy: false
};
var unsubMe = null, unsubPlayers = null;

/* ───────── Utilitários ───────── */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function val(id){ var el = $(id); return el ? el.value : ""; }
function initials(n){ var p = String(n||"?").trim().split(/\s+/); return ((p[0]||"?")[0] + (p.length>1 ? p[p.length-1][0] : "")).toUpperCase(); }
function primeiro(n){ return String(n||"").trim().split(/\s+/)[0] || ""; }
function nomeExib(p){ var a = (p.apelido||"").trim(), f = primeiro(p.nome); if(a && f && a.toLowerCase()!==f.toLowerCase()) return a + " · " + f; return a || f || "—"; }
function porApelido(a,b){ return (a.apelido||a.nome||"").localeCompare(b.apelido||b.nome||"","pt-BR"); }
function avatar(p, cls){ return '<div class="av '+(cls||"")+'" data-action="zoom" data-id="'+esc(p.id)+'">'+(p.foto?'<img src="'+esc(p.foto)+'" alt="">':esc(initials(p.nome)))+'</div>'; }
function isMaster(){ return !!S.me && S.me.role === "master" && S.me.status === "aprovado"; }
function fbAuthErr(e){
  var m = {
    "auth/invalid-email":"E-mail inválido.",
    "auth/user-not-found":"E-mail ou senha incorretos.",
    "auth/wrong-password":"E-mail ou senha incorretos.",
    "auth/invalid-credential":"E-mail ou senha incorretos.",
    "auth/invalid-login-credentials":"E-mail ou senha incorretos.",
    "auth/email-already-in-use":"Já existe um cadastro com esse e-mail.",
    "auth/weak-password":"Escolha uma senha com pelo menos 6 caracteres.",
    "auth/too-many-requests":"Muitas tentativas. Aguarde um pouco e tente de novo.",
    "auth/network-request-failed":"Sem conexão. Verifique sua internet.",
    "auth/popup-closed-by-user":"A janela do Google foi fechada antes de concluir.",
    "auth/cancelled-popup-request":"A janela do Google foi fechada antes de concluir.",
    "auth/popup-blocked":"O navegador bloqueou a janela do Google. Libere pop-ups e tente de novo.",
    "auth/unauthorized-domain":"Este endereço ainda não está autorizado no Firebase.",
    "auth/requires-recent-login":"Por segurança, entre de novo e repita a operação.",
    "permission-denied":"Sem permissão para essa operação."
  };
  var c = e && (e.code || ""); return m[c] || ("Algo deu errado. " + (c || (e && e.message) || ""));
}
function setMsg(tipo, txt){ S.msg = txt ? {tipo:tipo, txt:txt} : null; }
function msgHtml(){ if(!S.msg) return ""; var h = '<div class="msg '+S.msg.tipo+'" role="alert">'+esc(S.msg.txt)+'</div>'; return h; }

/* ───────── Listeners ───────── */
function stopListeners(){ if(unsubMe){ unsubMe(); unsubMe = null; } if(unsubPlayers){ unsubPlayers(); unsubPlayers = null; } if(typeof stopMesas === "function") stopMesas(); }
function listenPlayers(){
  if(unsubPlayers) return;
  var q = db.collection("jogadores");
  if(!isMaster()) q = q.where("status","==","aprovado");
  unsubPlayers = q.onSnapshot(function(snap){
    S.players = snap.docs.map(function(d){ var o = d.data(); o.id = d.id; return o; });
    render();
  }, function(){ /* sem permissao ainda */ });
}
function listenMe(uid){
  stopListeners(); S.meLoaded = false; S.me = null;
  unsubMe = db.collection("jogadores").doc(uid).onSnapshot(function(d){
    S.meLoaded = true;
    if(!d.exists){ S.me = null; render(); return; }
    S.me = d.data(); S.me.id = d.id;
    if(S.me.status === "aprovado"){
      if(unsubPlayers && isMaster() !== S._masterListen){ unsubPlayers(); unsubPlayers = null; }
      S._masterListen = isMaster(); listenPlayers(); listenMesas();
    }
    render();
  }, function(){ S.meLoaded = true; S.me = null; render(); });
}

if(FB){
  auth.onAuthStateChanged(function(u){
    if(S.registering) return;
    S.user = u;
    if(!u){ stopListeners(); S.me = null; S.meLoaded = true; S.players = []; render(); return; }
    S.edit = null; S.tab = "inicio"; listenMe(u.uid); render();
  });
} else {
  document.addEventListener("DOMContentLoaded", function(){ render(); });
}

/* ───────── Telas ───────── */
function render(){
  var app = $("app"); if(!app) return;
  var active = document.activeElement;
  if(active && /^(INPUT|SELECT|TEXTAREA)$/.test(active.tagName) && active.id && S.user && S.me && S.me.status==="aprovado" && (S.tab==="perfil" || active.id==="mesa_nome") && !S._forceRender) return; // nao interrompe digitacao
  S._forceRender = false;
  S._inGame = false;
  var h;
  if(!FB) h = viewOffline();
  else if(!S.user && S.meLoaded === false && !S.registering && !S._authReady) { h = viewLoading(); }
  else if(!S.user) h = viewAuth();
  else if(!S.meLoaded) h = viewLoading();
  else if(!S.me) h = viewComplete();
  else if(S.me.status === "pendente") h = viewPending();
  else if(S.me.status === "recusado") h = viewRefused();
  else h = viewApp();
  app.innerHTML = h + (S.modal ? modalHtml() : "") + (S._inGame ? "" : '<div class="build">Buraco da Família · build '+BUILD+'</div>');
  document.body.classList.toggle("ingame", !!S._inGame);
  if(S._inGame){ layoutFans(); fitMelds(); runAnims(); }
  if(S._inGame && S.game !== botSeen){ botSeen = S.game; botDrive(); }
}
function viewLoading(){ return '<div class="loading"><div><div class="spin"></div><p style="margin-top:12px">Carregando…</p></div></div>'; }
function viewOffline(){ return '<div class="wrap auth">'+brand()+'<div class="msg err">Não consegui carregar o Firebase. Verifique sua conexão e recarregue a página.</div><button class="btn" data-action="reload">Recarregar</button></div>'; }
function brand(){ return '<div class="brand"><div class="logo">♠</div><h1>Buraco da Família</h1><p>Jogue em dupla com quem você ama</p></div>'; }

function viewAuth(){
  var f = S.form || {}, h = ['<div class="wrap auth">', brand(), '<div class="panel">'];
  if(S.authTab === "login"){
    h.push('<div class="eyebrow">Acesso</div><h2 class="ph">Entrar</h2>');
    h.push('<label class="f">E-mail<input class="in" id="li_email" type="email" autocomplete="username" value="'+esc(f.li_email||"")+'"></label>');
    h.push('<label class="f">Senha<input class="in" id="li_senha" type="password" autocomplete="current-password"></label>');
    h.push(msgHtml());
    h.push('<button class="btn" data-action="login"'+(S.busy?" disabled":"")+'>Entrar</button>');
    h.push('<div class="or">ou</div><button class="btn gbtn" data-action="google">Entrar com Google</button>');
    h.push('<div style="text-align:center;margin-top:14px"><button class="link" data-action="forgot">Esqueci minha senha</button></div>');
    h.push('<div style="text-align:center;margin-top:8px" class="muted">Primeira vez? <button class="link" data-action="tab-reg">Criar cadastro</button></div>');
  } else {
    h.push('<div class="eyebrow">Novo por aqui</div><h2 class="ph">Criar cadastro</h2>');
    h.push('<p class="muted" style="margin-top:6px">Depois de enviar, um administrador precisa aprovar seu acesso.</p>');
    h.push(regFields(f, false));
    h.push('<label class="f">Senha<input class="in" id="rg_senha" type="password" autocomplete="new-password"></label>');
    h.push('<label class="f">Confirmar senha<input class="in" id="rg_senha2" type="password" autocomplete="new-password"></label>');
    h.push(msgHtml());
    h.push('<button class="btn" data-action="register"'+(S.busy?" disabled":"")+'>Enviar cadastro</button>');
    h.push('<div class="or">ou</div><button class="btn gbtn" data-action="google">Cadastrar com Google</button>');
    h.push('<div style="text-align:center;margin-top:12px" class="muted">Já tem cadastro? <button class="link" data-action="tab-login">Entrar</button></div>');
  }
  h.push('</div></div>');
  return h.join("");
}
function regFields(f, emailLocked){
  return '<label class="f">Nome completo<input class="in" id="rg_nome" autocomplete="name" value="'+esc(f.rg_nome||"")+'"></label>'+
    '<label class="f">Apelido (como a família te chama)<input class="in" id="rg_apelido" value="'+esc(f.rg_apelido||"")+'"></label>'+
    '<label class="f">Quem é você na família? (opcional)<input class="in" id="rg_relacao" placeholder="ex.: sogra, primo, cunhado" value="'+esc(f.rg_relacao||"")+'"></label>'+
    '<label class="f">Telefone (opcional)<input class="in" id="rg_tel" type="tel" autocomplete="tel" value="'+esc(f.rg_tel||"")+'"></label>'+
    '<label class="f">E-mail<input class="in" id="rg_email" type="email" autocomplete="email" '+(emailLocked?"readonly ":"")+'value="'+esc(f.rg_email||"")+'"></label>';
}
function viewComplete(){
  var u = S.user, f = S.form || {};
  if(f.rg_nome == null) f.rg_nome = u.displayName || "";
  if(f.rg_apelido == null) f.rg_apelido = primeiro(u.displayName);
  if(f.rg_email == null) f.rg_email = u.email || "";
  S.form = f;
  return '<div class="wrap auth">'+brand()+'<div class="panel"><div class="eyebrow">Quase lá</div><h2 class="ph">Complete seu cadastro</h2>'+
    '<p class="muted" style="margin-top:6px">Entrou com '+esc(u.email||"Google")+'. Falta confirmar seus dados.</p>'+regFields(f, true)+msgHtml()+
    '<button class="btn" data-action="complete"'+(S.busy?" disabled":"")+'>Enviar cadastro</button>'+
    '<div style="text-align:center;margin-top:12px"><button class="link" data-action="logout">Sair</button></div></div></div>';
}
function viewPending(){
  return '<div class="wrap auth">'+brand()+'<div class="panel" style="text-align:center"><div style="font-size:40px">⏳</div><h2 class="ph">Aguardando aprovação</h2>'+
    '<p class="muted" style="margin-top:8px">Seu cadastro foi enviado, '+esc(primeiro(S.me.nome))+'. Assim que o administrador aprovar, você já entra na mesa. Pode fechar esta tela e voltar depois.</p>'+
    '<button class="btn ghost" data-action="logout">Sair</button></div></div>';
}
function viewRefused(){
  return '<div class="wrap auth">'+brand()+'<div class="panel" style="text-align:center"><h2 class="ph">Cadastro não aprovado</h2>'+
    '<p class="muted" style="margin-top:8px">Fale com o administrador da família.</p><button class="btn ghost" data-action="logout">Sair</button></div></div>';
}

/* App aprovado */
function viewApp(){
  if(S.mesaId){ var mv = viewMesa(); if(mv) return mv; }
  var pend = isMaster() ? S.players.filter(function(p){ return p.status === "pendente"; }).length : 0;
  var h = ['<div class="wrap">'];
  h.push('<div class="topbar"><div class="who">'+avatar(S.me)+'<div><div class="name">'+esc(nomeExib(S.me))+'</div><div class="sub">'+(isMaster()?"Master":"Jogador")+'</div></div></div><button class="btn ghost small" data-action="logout">Sair</button></div>');
  h.push('<div class="tabs" role="tablist">');
  h.push(tabBtn("inicio","Início")); h.push(tabBtn("perfil","Meu cadastro"));
  if(isMaster()) h.push(tabBtn("admin","Administração", pend));
  h.push('</div>');
  if(S.tab === "perfil") h.push(viewPerfil());
  else if(S.tab === "admin" && isMaster()) h.push(viewAdmin());
  else h.push(viewInicio());
  h.push('</div>');
  return h.join("");
}
function tabBtn(id, label, dot){ return '<button class="tab'+(S.tab===id?" on":"")+'" role="tab" data-action="tab" data-id="'+id+'">'+label+(dot?'<span class="dot"></span>':"")+'</button>'; }

function viewInicio(){
  var ap = S.players.filter(function(p){ return p.status === "aprovado"; }).sort(porApelido);
  var h = [mesasPanel()];
  h.push('<div class="panel"><div class="eyebrow">Família</div><h2 class="ph">Quem está por aqui</h2>');
  if(!ap.length) h.push('<p class="muted" style="margin-top:8px">Carregando…</p>');
  ap.forEach(function(p){
    h.push('<div class="row">'+avatar(p,"sm")+'<div class="grow"><div class="t">'+esc(nomeExib(p))+'</div>'+(p.relacao?'<div class="s">'+esc(p.relacao)+'</div>':"")+'</div>'+(p.role==="master"?'<span class="badge m">Master</span>':"")+'</div>');
  });
  h.push('</div>');
  return h.join("");
}

function ensureEdit(){
  if(!S.edit || S.edit._id !== S.me.id){
    S.edit = { _id:S.me.id, nome:S.me.nome||"", apelido:S.me.apelido||"", relacao:S.me.relacao||"", tel:S.me.telefone||"" };
  }
  return S.edit;
}
function viewPerfil(){
  var e = ensureEdit(), u = S.user, usaSenha = (u.providerData||[]).some(function(p){ return p.providerId === "password"; });
  var h = ['<div class="panel"><div class="eyebrow">Perfil</div><h2 class="ph">Meu cadastro</h2>'];
  h.push('<div class="photoedit"><div class="photobig">'+(S.me.foto?'<img src="'+esc(S.me.foto)+'" alt="">':esc(initials(e.nome)))+'</div><div>'+
    '<button class="btn ghost small" data-action="pick-foto">'+(S.me.foto?"Trocar foto":"Adicionar foto")+'</button>'+
    (S.me.foto?' <button class="btn ghost small" data-action="rem-foto">Remover</button>':"")+'<div class="muted" style="margin-top:6px">A foto é salva na hora.</div></div></div>');
  h.push('<label class="f">Nome completo<input class="in" id="pf_nome" value="'+esc(e.nome)+'"></label>');
  h.push('<label class="f">Apelido<input class="in" id="pf_apelido" value="'+esc(e.apelido)+'"></label>');
  h.push('<label class="f">Quem é você na família?<input class="in" id="pf_relacao" value="'+esc(e.relacao)+'"></label>');
  h.push('<label class="f">Telefone<input class="in" id="pf_tel" type="tel" value="'+esc(e.tel)+'"></label>');
  h.push('<label class="f">E-mail (login)<input class="in" value="'+esc(S.me.email||u.email||"")+'" readonly></label>');
  h.push(S.tab==="perfil" && S.msg ? msgHtml() : "");
  h.push('<button class="btn" data-action="save-perfil">Salvar</button></div>');
  h.push('<div class="panel"><div class="eyebrow">Segurança</div><h2 class="ph">Senha</h2>');
  if(usaSenha){
    h.push('<label class="f">Senha atual<input class="in" id="pw_atual" type="password" autocomplete="current-password"></label>');
    h.push('<label class="f">Nova senha<input class="in" id="pw_nova" type="password" autocomplete="new-password"></label>');
    h.push('<label class="f">Confirmar nova senha<input class="in" id="pw_conf" type="password" autocomplete="new-password"></label>');
    h.push('<button class="btn ghost" data-action="change-pass">Trocar senha</button>');
  } else {
    h.push('<p class="muted" style="margin-top:6px">Sua conta usa o login do Google, então não há senha para trocar aqui.</p>');
  }
  h.push('</div>');
  h.push('<div class="panel"><div class="eyebrow">Jogos</div><h2 class="ph">Minhas estatísticas</h2><div class="stats"><div class="stat"><b>0</b><span>Partidas</span></div><div class="stat"><b>0</b><span>Vitórias</span></div><div class="stat"><b>0</b><span>Pontos</span></div></div><p class="muted" style="margin-top:10px">As estatísticas começam a contar quando as mesas abrirem.</p></div>');
  return h.join("");
}

function viewAdmin(){
  var pend = S.players.filter(function(p){ return p.status === "pendente"; }).sort(porApelido);
  var elenco = S.players.filter(function(p){ return p.status !== "pendente"; }).sort(porApelido);
  var h = ['<div class="panel"><div class="eyebrow">Fila de acesso</div><h2 class="ph">Aprovações pendentes <span class="badge p">'+pend.length+'</span></h2>'];
  if(!pend.length) h.push('<p class="muted" style="margin-top:8px">Ninguém esperando aprovação.</p>');
  pend.forEach(function(p){ h.push(playerRow(p, true)); });
  h.push('</div>');
  h.push(S.tab==="admin" && S.msg ? msgHtml() : "");
  h.push('<div class="panel"><div class="eyebrow">Elenco</div><h2 class="ph">Jogadores <span class="badge">'+elenco.length+'</span></h2>');
  elenco.forEach(function(p){ h.push(playerRow(p, false)); });
  h.push('</div>');
  return h.join("");
}
function playerRow(p, pend){
  var acts = '';
  if(pend) acts = '<button class="btn mini ok" data-action="approve" data-id="'+p.id+'">Aprovar</button> <button class="btn mini danger" data-action="reject" data-id="'+p.id+'">Recusar</button>';
  else if(p.id !== S.me.id){
    acts = (p.status==="recusado" ? '<button class="btn mini ok" data-action="approve" data-id="'+p.id+'">Aprovar</button> ' : '')+
      '<button class="btn mini ghost" data-action="reset-link" data-id="'+p.id+'">Redefinir senha</button> <button class="btn mini danger" data-action="remove" data-id="'+p.id+'">Remover</button>';
  }
  return '<div class="row" style="align-items:flex-start">'+avatar(p,"sm")+'<div class="grow"><div class="t">'+esc(p.nome||"—")+(p.apelido?' <span class="muted">('+esc(p.apelido)+')</span>':"")+'</div>'+
    '<div class="s">'+esc(p.email||"")+(p.relacao?' · '+esc(p.relacao):"")+(p.telefone?' · '+esc(p.telefone):"")+'</div>'+
    (p.status==="recusado"?'<span class="badge p">Recusado</span> ':"")+(p.role==="master"?'<span class="badge m">Master</span>':"")+
    (acts?'<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">'+acts+'</div>':"")+'</div></div>';
}
function modalHtml(){
  var p = S.modal;
  return '<div class="modalbg" data-action="close-modal"><div class="modal" data-stop="1"><div class="big">'+(p.foto?'<img src="'+esc(p.foto)+'" alt="">':esc(initials(p.nome)))+'</div>'+

function withTimeout(p, ms){ return new Promise(function(res, rej){ var t = setTimeout(function(){ rej({ message:"Tempo esgotado" }); }, ms); p.then(function(v){ clearTimeout(t); res(v); }, function(e){ clearTimeout(t); rej(e); }); }); }
function acceptRemote(d){
  if(!d || !d.exists) return;
  var data = d.data(), v = data.v || 0;

  if(!S.sending && S.game && v === S.gameV) return;     // nada novo
  var prev = S.game, g; try{ g = JSON.parse(data.json); }catch(e){ return; }
  var me = mySeat(S.lastMesa);
  if(v < (S.gameV || 0) && !S.sending && prev) return;
  S.game = g; S.gameV = v; cleanSel();
  if(me >= 0) processLog(prev, g, me);

}

}

  var prev = g; S.game = r.state; S.gameV = (S.gameV || 0) + 1; S.sel = []; S.picker = null; S.menu = false;
  processLog(prev, r.state, me);

  var ref = estadoRef(S.mesaId);
  withTimeout(db.runTransaction(function(tx){ return tx.get(ref).then(function(d){
    var st = JSON.parse(d.data().json), v = (d.data().v || 0) + 1, rr = E.applyAction(st, action, Date.now());
    if(!rr.ok) return { ok:false, error:rr.error };

var botTimer = null, botSeen = null;
function botDrive(){
  var g = S.game, m = S.lastMesa;
  if(!g || !m || !S.user || !window.BuracoBot) return;
  var me = mySeat(m); if(me < 0) return;
  var bots = [], humans = [];
  m.seats.forEach(function(u, i){ if(isBot(u)) bots.push(i); else if(u) humans.push(i); });
  if(!bots.length) return;
  var act; try{ act = BuracoBot.pendingAction(g, bots); }catch(e){ act = null; }
  clearTimeout(botTimer); botTimer = null;
  if(!act) return;
  var rank = Math.max(0, humans.indexOf(me));
  var delay = act.type === "VOTE_END" ? 800 : 3000;
  delay += rank * 3500;
  botTimer = setTimeout(function(){
    botTimer = null;
    if(S.sending || S.game !== g){ botSeen = null; botDrive(); return; }
    var a2; try{ a2 = BuracoBot.pendingAction(S.game, bots); }catch(e){ a2 = null; }
    if(a2) doAct(a2, true);
  }, delay);
}

  if(Date.now() < g.turn.deadline + 900 + me * 700) return;

    var st = JSON.parse(d.data().json), evs = E.processTimeouts(st, Date.now());
    if(evs.length) tx.set(ref, { json:JSON.stringify(st), v:(d.data().v || 0) + 1 });

  h.push('<div class="felt"><div class="center">'+
    '<div class="pile'+(canPick?" tapok":"")+'" data-action="g-stock"><div id="pile-stock" class="pc back" style="--cw:32px"></div><div>Monte<br><b>'+g.stock.length+'</b></div></div>'+
    '<div class="discardbox'+(canPick&&dis.length?" tapok":"")+'" id="pile-discard" '+(dis.length?'data-action="g-discard"':'')+' style="--cw:28px">'+(dis.length?drows:'<div class="cap" style="padding:8px 2px;opacity:.7">Lixo vazio</div>')+'<div class="cap">Lixo · '+dis.length+(canPick&&dis.length?' · toque para pegar':"")+'</div></div>'+
    '<div class="mortos">Mortos <b>'+g.mortos.length+'</b><br>nós '+(g.teams[team].mortoTaken?"✓":"—")+'<br>eles '+(g.teams[opp].mortoTaken?"✓":"—")+'</div></div>');
  var lastE = null, lg = (g.log||[]); for(var q=lg.length-1;q>=0;q--){ if(logTxt(g, lg[q])){ lastE = lg[q]; break; } }
  h.push('<div class="lastact">'+(lastE?esc(logTxt(g,lastE))+(lastE.type==="DISCARDED"?' <span style="--cw:22px">'+cardHtml(lastE.card,"")+'</span>':""):"&nbsp;")+'</div>');
  var tap = myTurn && g.phase==="PLAYING" && S.sel.length>=1;
  h.push('<div id="meldarea">'+halfHtml(g, opp, false, false)+halfHtml(g, team, true, tap)+'</div></div>');
  // status + ações
  var left = timerInfo(g);
  var st = !active ? "" : (g.paused ? "⏸ Jogo pausado" : (myTurn ? '<div class="turnbar">▶ SUA VEZ · '+(g.phase==="WAITING_TURN"?"toque no monte ou no lixo":(S.sel.length===1?"toque num jogo ou descarte":"selecione cartas"))+'</div>' : "Vez de <b>"+esc(g.players[g.turn.player].name)+'</b>'+(isBot(m.seats[g.turn.player])?' <span class="dots"></span>':"")));
  h.push('<div class="statusrow">'+st+(left!==null?'<span id="tnum" style="margin-left:auto;font-weight:800">'+left+'s</span>':"")+(S.sending?'<span class="muted" style="margin-left:auto">enviando…</span>':"")+'</div>');
  if(myTurn && g.phase==="PLAYING"){
    h.push('<div class="acts"><button class="btn" data-action="g-lay"'+(S.sel.length>=3?"":" disabled")+'>Baixar jogo'+(S.sel.length>=3?" ("+S.sel.length+")":"")+'</button><button class="btn danger" data-action="g-throw"'+(S.sel.length===1?"":" disabled")+'>Descartar</button></div>');
  }
  var mine = sortedHand(g.players[me].hand), hn = now < S.newUntil ? S.newIds : [];
  var hrows = rowsOf(mine, 15).map(function(r){ return '<div class="hrow">'+r.map(function(c){ var isNew = hn.indexOf(c.id) >= 0; return cardHtml(c, (S.sel.indexOf(c.id)>=0?"sel ":"")+(isNew?"new":""), 'data-action="g-sel" data-id="'+c.id+'"'); }).join("")+'</div>'; }).join("");
  h.push('<div class="handwrap'+(myTurn?" mt":"")+'" id="handwrap"><div class="handhead"><span class="eyebrow">Sua mão · '+mine.length+'</span><button class="link" data-action="g-sort">Ordenar por '+(S.sortMode==="suit"?"número":"naipe")+'</button></div>'+hrows+'</div>');
  h.push('</div>');
  var out = h.join("");
  if(S.banner && now < S.banner.until) out += '<div class="banner '+S.banner.cls+'">'+esc(S.banner.txt)+'<small>'+esc(S.banner.sub)+'</small></div>';
  if(S.zoom){ var zt = S.zoom === "us" ? team : opp; out += '<div class="modalbg" data-action="close-zoom"><div class="modal wide" data-stop="1"><h3>'+(S.zoom==="us"?"Nossos jogos":"Jogos deles")+'</h3><div class="zoombox"><div class="meldwrap">'+g.teams[zt].melds.map(function(ml){ return meldHtml(ml, false); }).join("")+'</div></div><button class="btn ghost" data-action="close-zoom">Fechar</button></div></div>'; }
  if(S.picker) out += pickerHtml();
  if(g.paused && g.phase !== "GAME_OVER") out += '<div class="modalbg"><div class="modal"><div style="font-size:42px">⏸</div><h3>Jogo pausado</h3><p class="muted" style="margin-top:6px">'+esc(g.players[g.paused.by].name)+' pausou a partida.</p><button class="btn" data-action="g-resume">Continuar</button><button class="btn ghost" data-action="mesa-back">Sair e voltar depois</button><p class="muted" style="margin-top:8px;font-size:12px">A partida fica salva: dá para retomar em outro momento.</p></div></div>';
  if(S.menu) out += '<div class="modalbg" data-action="close-menu"><div class="modal wide" data-stop="1"><h3>Mais opções</h3><button class="btn ghost" data-action="g-propose-end"'+(g.endVote?" disabled":"")+'>Propor encerrar a partida</button>'+(canForceEnd(m)?'<button class="btn danger" data-action="g-end-now">Encerrar agora (administrador)</button>':"")+'<button class="btn ghost" data-action="close-menu">Fechar</button></div></div>';
  if(g.phase==="ROUND_OVER" || g.phase==="GAME_OVER") out += endHtml(g, team, opp);
  if(S.toast) out += '<div class="toast">'+esc(S.toast)+'</div>';
  return out;
}
function pickerHtml(){
  var p = S.picker, h = ['<div class="modalbg"><div class="modal wide"><h3>Como colocar?</h3><p class="muted" style="margin-top:4px">Há mais de uma forma de encaixar. Escolha:</p>'];
  p.opts.forEach(function(o,i){
    var w = o.entries.filter(function(e){ return e.wild; })[0];
    h.push('<button class="opt" data-action="pick-opt" data-id="'+i+'">'+entriesHtml(o.entries)+'<div class="muted" style="margin-top:6px">'+(o.clean?"Jogo limpo":("Coringa no lugar do "+posLabel(w.pos)))+'</div></button>');
  });
  h.push('<button class="btn ghost" data-action="pick-cancel">Cancelar</button></div></div>');
  return h.join("");
}
function endHtml(g, team, opp){
  var r = g.roundResult, over = g.phase === "GAME_OVER", win = g.winner === team, early = r.reason === "EARLY";
  var title = over ? (early ? "Partida cancelada" : (win ? "🏆 Vitória!" : "Fim de jogo")) : "Fim da rodada";
  var sub = early ? "Encerrada antes da meta: os pontos foram cancelados e não há vencedor." : (r.reason==="BATIDA" ? esc(g.players[r.by].name)+" bateu!" : "O monte acabou.");
  var h = ['<div class="modalbg"><div class="modal wide"><h3>'+title+'</h3><p class="muted" style="margin-top:4px">'+sub+'</p>'];
  if(!early) h.push('<table class="tbl"><tr><th></th><th>Nós</th><th>Eles</th></tr>');
  if(!early && r.detail){
    var d = r.detail;
    [["Morto","morto"],["Batida","batida"],["Cartas","cartas"]].forEach(function(x){ h.push('<tr><td>'+x[0]+'</td><td>'+d[team][x[1]]+'</td><td>'+d[opp][x[1]]+'</td></tr>'); });
    [["Canastra suja","suja"],["Canastra limpa","limpa"],["Canastra 500","c500"],["Canastra 1000","c1000"]].forEach(function(x){
      if(d[team][x[1]].count || d[opp][x[1]].count) h.push('<tr><td>'+x[0]+'</td><td>'+d[team][x[1]].points+' <span class="muted">('+d[team][x[1]].count+')</span></td><td>'+d[opp][x[1]].points+' <span class="muted">('+d[opp][x[1]].count+')</span></td></tr>');
    });
    h.push('<tr class="tot"><td>Rodada</td><td>'+d[team].total+'</td><td>'+d[opp].total+'</td></tr>');
  }
  if(!early) h.push('<tr class="tot"><td>Placar</td><td>'+r.scoresAfter[team]+'</td><td>'+r.scoresAfter[opp]+'</td></tr>');
  if(!early) h.push('</table>');
  h.push(over ? '<button class="btn" data-action="mesa-back">Voltar às mesas</button>' : '<button class="btn" data-action="g-next">Próxima rodada</button>');
  h.push('</div></div>');
  return h.join("");
}

/* encaixa as cartas em leque, sem rolagem, e ajusta o tamanho dos jogos */
function layoutFans(){
  var rows = document.querySelectorAll(".hrow, .fanrow");
  for(var i=0;i<rows.length;i++){
    var row = rows[i], cs = row.children, n = cs.length; if(!n) continue;
    var w = cs[0].offsetWidth, W = row.clientWidth;
    for(var j=0;j<n;j++) cs[j].style.marginLeft = "";
    if(n > 1){
      var step = Math.min(w * (row.className.indexOf("hrow")>=0 ? 0.62 : 0.7), (W - w) / (n - 1));
      for(var k=1;k<n;k++) cs[k].style.marginLeft = (step - w) + "px";
    }
  }
}
function fitMelds(){
  var area = $("meldarea"); if(!area) return;
  var halves = area.querySelectorAll(".mhalf");
  function over(hf){ return hf.scrollHeight > hf.clientHeight + 1; }
  for(var i=0;i<halves.length;i++){
    var hf = halves[i], ms = 1.25; hf.classList.remove("dense"); hf.style.setProperty("--ms", ms);
    var guard = 0;
    while(over(hf) && ms > 0.62 && guard++ < 14){ ms = Math.round((ms - 0.06) * 100) / 100; hf.style.setProperty("--ms", ms); }
    if(over(hf)){ hf.classList.add("dense"); ms = Math.max(ms, 0.9); hf.style.setProperty("--ms", ms); guard = 0;
      while(over(hf) && ms > 0.42 && guard++ < 14){ ms = Math.round((ms - 0.05) * 100) / 100; hf.style.setProperty("--ms", ms); } }
  }
}
setInterval(function(){
  var g = S.game; if(!g || !S.mesaId) return;
  var n = $("tnum"), t = timerInfo(g); if(n && t !== null) n.textContent = t + "s";
  checkTimeouts();
}, 500);
window.addEventListener("resize", function(){ if(S._inGame){ layoutFans(); fitMelds(); } });

document.addEventListener("click", function(ev){
  var el = ev.target.closest("[data-action]"); if(!el) return;
  var da0 = el.getAttribute("data-action"); if((da0 === "close-modal" || da0 === "close-menu" || da0 === "close-zoom") && ev.target.closest("[data-stop]") && !ev.target.closest("button")) return;
  var act = el.getAttribute("data-action"), id = el.getAttribute("data-id");
  switch(act){
    case "reload": location.reload(); break;
    case "mesa-criar": criarMesa(); break;
    case "mesa-abrir": S.mesaId = id; S._forceRender = true; render(); break;
    case "mesa-back": closeMesa(); break;
    case "sit": sitAt(parseInt(id,10)); break;
    case "stand": standUp(); break;
    case "add-bot": setBot(parseInt(id,10), true); break;
    case "rm-bot": setBot(parseInt(id,10), false); break;
    case "start-match": startMatch(); break;
    case "del-mesa": deleteMesa(); break;
    case "g-sel": var cid = parseInt(id,10), ix = S.sel.indexOf(cid); if(ix>=0) S.sel.splice(ix,1); else S.sel.push(cid); S._forceRender = true; render(); break;
    case "g-sort": S.sortMode = S.sortMode==="suit" ? "rank" : "suit"; S._forceRender = true; render(); break;
    case "g-stock": tapStock(); break;
    case "g-discard": tapDiscard(); break;
    case "g-mute": MUTED = !MUTED; try{ localStorage.setItem("buraco_mute", MUTED ? "1" : "0"); }catch(e){} if(!MUTED){ unlockAudio(true); setTimeout(function(){ sfx("turn"); }, 120); } S._forceRender = true; render(); break;
    case "g-pause": jogar("PAUSE"); break;
    case "g-resume": jogar("RESUME"); break;
    case "zoom-melds": S.zoom = id; S._forceRender = true; render(); break;
    case "close-zoom": S.zoom = null; S._forceRender = true; render(); break;
    case "g-menu": S.menu = true; S._forceRender = true; render(); break;
    case "close-menu": S.menu = false; S._forceRender = true; render(); break;
    case "g-propose-end": jogar("PROPOSE_END"); break;
    case "g-end-now": if(confirm("Encerrar a partida agora para todos?")) jogar("END_NOW"); break;
    case "vote-yes": jogar("VOTE_END", { yes:true }); break;
    case "vote-no": jogar("VOTE_END", { yes:false }); break;
    case "g-lay": layLayout(); break;
    case "g-throw": if(S.sel.length===1) jogar("DISCARD", { cardId:S.sel[0] }); break;
    case "meld-add": addToMeld(parseInt(id,10)); break;
    case "pick-opt": pickOption(parseInt(id,10)); break;
    case "pick-cancel": S.picker = null; S._forceRender = true; render(); break;
    case "g-next": jogar("START_NEXT_ROUND"); break;
    case "tab": setMsg(); S.tab = id; S._forceRender = true; render(); break;
    case "tab-reg": keepForm(); setMsg(); S.authTab = "reg"; render(); break;
    case "tab-login": keepForm(); setMsg(); S.authTab = "login"; render(); break;
    case "login": doLogin(); break;
    case "register": doRegister(); break;
    case "complete": doComplete(); break;
    case "google": doGoogle(); break;
    case "forgot": doForgot(); break;
    case "logout": setMsg(); S.form = {}; auth.signOut(); break;
    case "save-perfil": savePerfil(); break;
    case "change-pass": changePass(); break;
    case "pick-foto": $("fotoInput").click(); break;
    case "rem-foto": setFoto(null); break;
    case "zoom": var p = (S.me && S.me.id===id) ? S.me : playerById(id); if(p){ S.modal = p; S._forceRender = true; render(); } break;
    case "close-modal": S.modal = null; S._forceRender = true; render(); break;
    case "approve": masterSet(id, { status:"aprovado" }, "Cadastro aprovado."); break;
    case "reject": masterSet(id, { status:"recusado" }, "Cadastro recusado."); break;
    case "remove": var q = playerById(id); if(q && confirm("Remover "+(q.apelido||q.nome)+" da família? Ele(a) poderá pedir acesso de novo.")){ db.collection("jogadores").doc(id).delete().then(function(){ setMsg("ok","Jogador removido."); S._forceRender = true; render(); }).catch(function(er){ setMsg("err", fbAuthErr(er)); S._forceRender = true; render(); }); } break;
    case "reset-link": var r = playerById(id); if(r && r.email){ auth.sendPasswordResetEmail(r.email).then(function(){ setMsg("ok","Link de redefinição enviado para "+r.email+"."); S._forceRender = true; render(); }).catch(function(er){ setMsg("err", fbAuthErr(er)); S._forceRender = true; render(); }); } break;
  }
});
document.addEventListener("keydown", function(ev){
  if(ev.key !== "Enter") return;
  var id = ev.target && ev.target.id; if(!id) return;
  if(id === "li_email" || id === "li_senha") doLogin();
});
$("fotoInput").addEventListener("change", function(ev){
  var f = ev.target.files && ev.target.files[0]; ev.target.value = ""; if(!f || !S.me) return;
  resizeToDataUrl(f, 320, function(url){ if(!url){ setMsg("err","Não consegui ler essa imagem."); S._forceRender = true; render(); return; } setFoto(url); });
});
document.addEventListener("visibilitychange", function(){ if(!document.hidden && !(document.activeElement && /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName))){ S._forceRender = true; render(); } });
setTimeout(function(){ S._authReady = true; render(); }, 4000);
render();
</script>
